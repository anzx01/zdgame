<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 小游戏工坊</title>
  <style>
    :root {
      --ink: #17191f;
      --paper: #fff4cf;
      --cream: #ffe6a2;
      --red: #f15b4a;
      --green: #39b36f;
      --cyan: #37b6c9;
      --yellow: #ffd447;
      --blue: #334e9e;
      --line: #17191f;
      --muted: #6f6652;
      --panel: rgba(255, 244, 207, 0.96);
      --shadow: rgba(23, 25, 31, 0.22);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23, 25, 31, 0.06) 1px, transparent 1px) 0 0 / 22px 22px,
        linear-gradient(0deg, rgba(23, 25, 31, 0.06) 1px, transparent 1px) 0 0 / 22px 22px,
        linear-gradient(135deg, #ffe082 0%, #ffb35c 42%, #66d99b 100%);
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      padding: 18px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 3px solid var(--line);
      background: var(--yellow);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
      padding: 10px 13px;
      box-shadow: 0 4px 0 var(--line);
      border-radius: 6px;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #ffe377;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--line);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    .btn-primary {
      background: var(--red);
      color: #fff9df;
    }

    .btn-primary:hover {
      background: #ff725f;
    }

    .btn-green {
      background: var(--green);
      color: #fff9df;
    }

    .btn-blue {
      background: var(--cyan);
      color: #fff;
    }

    .btn-danger {
      background: #2b2f3b;
      color: #fff9df;
    }

    .btn-ghost {
      background: #fff9df;
      color: var(--ink);
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .topline {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border: 4px solid var(--line);
      background:
        linear-gradient(90deg, transparent 0 18px, rgba(23, 25, 31, 0.18) 18px 22px, transparent 22px),
        linear-gradient(0deg, var(--red) 0 50%, var(--yellow) 50%);
      box-shadow: 0 5px 0 var(--line);
      border-radius: 7px;
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .brand-mark::before {
      width: 16px;
      height: 7px;
      left: 8px;
      top: 11px;
      box-shadow: 21px 0 0 var(--ink), 10px 22px 0 var(--ink);
    }

    .brand-mark::after {
      width: 8px;
      height: 8px;
      right: 8px;
      bottom: 8px;
      background: var(--cyan);
      border: 3px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.58);
    }

    .subtitle {
      margin: 5px 0 0;
      color: #473e2f;
      font-weight: 900;
    }

    .status-pill {
      justify-self: end;
      border: 3px solid var(--line);
      background: var(--panel);
      box-shadow: 0 4px 0 var(--line);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-pill.ready {
      background: #d8ffd9;
    }

    .status-pill.warn {
      background: #ffe0ca;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 0.82fr) minmax(420px, 1.18fr);
      gap: 16px;
      align-items: start;
    }

    .surface {
      border: 4px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 0 var(--line), 0 16px 26px var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .surface-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--ink);
      color: #fff9df;
      border-bottom: 4px solid var(--line);
    }

    .surface-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .surface-body {
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 900;
      color: #534932;
    }

    input,
    textarea {
      width: 100%;
      border: 3px solid var(--line);
      background: #fffdf1;
      color: var(--ink);
      border-radius: 6px;
      outline: none;
      padding: 12px 13px;
      font-weight: 800;
      box-shadow: inset 0 -3px 0 rgba(23, 25, 31, 0.09);
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: inset 0 -3px 0 rgba(241, 91, 74, 0.18), 0 0 0 4px rgba(255, 212, 71, 0.44);
    }

    .example-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 16px;
    }

    .chip {
      padding: 7px 10px;
      border: 3px solid var(--line);
      background: #fff9df;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--line);
      font-size: 13px;
      font-weight: 900;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .message {
      min-height: 45px;
      margin-top: 14px;
      border: 3px solid var(--line);
      background: #fff9df;
      border-radius: 6px;
      padding: 10px 12px;
      font-weight: 900;
      color: #514632;
    }

    .message.error {
      background: #ffe0dc;
      color: #7a2018;
    }

    .message.ok {
      background: #dcffe4;
      color: #155c33;
    }

    .library-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(360px, 100%);
    }

    .library-tools input {
      padding: 9px 11px;
      border-width: 2px;
      box-shadow: none;
      font-size: 14px;
    }

    .game-list {
      display: grid;
      gap: 10px;
    }

    .game-row {
      border: 3px solid var(--line);
      background: #fff9df;
      border-radius: 7px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 0 rgba(23, 25, 31, 0.22);
    }

    .game-row h3 {
      margin: 0 0 5px;
      font-size: 20px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .tag {
      border: 2px solid rgba(23, 25, 31, 0.22);
      background: rgba(255, 212, 71, 0.28);
      border-radius: 999px;
      padding: 3px 7px;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 320px;
    }

    .row-actions button {
      padding: 8px 10px;
      font-size: 13px;
      border-width: 2px;
      box-shadow: 0 3px 0 var(--line);
    }

    .empty-state {
      border: 3px dashed var(--line);
      background: rgba(255, 249, 223, 0.66);
      border-radius: 7px;
      padding: 28px;
      text-align: center;
      font-weight: 900;
      color: #554b38;
    }

    .hidden {
      display: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(23, 25, 31, 0.74);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .preview-shell {
      width: min(1180px, 100%);
      height: min(780px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto 1fr;
      border: 4px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 0 10px 0 var(--line);
      overflow: hidden;
    }

    .preview-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--ink);
      color: #fff9df;
      border-bottom: 4px solid var(--line);
    }

    .preview-title {
      min-width: 0;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .preview-actions button {
      padding: 8px 10px;
      border-width: 2px;
      box-shadow: 0 3px 0 var(--line);
      font-size: 13px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }

    .dialog {
      width: min(560px, 100%);
      border: 4px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 0 8px 0 var(--line);
      overflow: hidden;
    }

    .dialog-head {
      background: var(--ink);
      color: #fff9df;
      padding: 13px 15px;
      border-bottom: 4px solid var(--line);
      font-weight: 900;
    }

    .dialog-body {
      padding: 16px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .busy-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(255, 244, 207, 0.64);
      backdrop-filter: blur(2px);
    }

    .busy-box {
      min-width: min(420px, calc(100vw - 36px));
      border: 4px solid var(--line);
      background: var(--ink);
      color: #fff9df;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 0 8px 0 var(--line);
      font-weight: 900;
    }

    .busy-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 18px;
      border: 3px solid #fff9df;
      background: rgba(255, 249, 223, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--green), var(--cyan));
      transition: width 360ms ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #fff4cf;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .topline,
      .workspace {
        grid-template-columns: 1fr;
      }

      .status-pill {
        justify-self: start;
      }

      .game-row {
        grid-template-columns: 1fr;
      }

      .row-actions {
        justify-content: start;
        max-width: none;
      }

      .preview-bar {
        grid-template-columns: 1fr;
      }

      .preview-actions {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI 小游戏工坊</h1>
          <p class="subtitle">一句话生成、试玩、修改和下载 HTML 小游戏</p>
        </div>
      </div>
      <div id="providerStatus" class="status-pill">DeepSeek 检测中</div>
    </header>

    <section class="workspace">
      <section class="surface" aria-label="生成游戏">
        <div class="surface-head">
          <h2>生成新游戏</h2>
          <span>DeepSeek</span>
        </div>
        <div class="surface-body">
          <form id="generateForm">
            <div class="field">
              <label for="gameName">游戏名称</label>
              <input id="gameName" name="gameName" autocomplete="off" maxlength="80" placeholder="例如：推箱子游戏" required>
            </div>

            <div class="example-grid" aria-label="快速示例">
              <button class="chip" type="button" data-example="推箱子游戏">推箱子</button>
              <button class="chip" type="button" data-example="太空射击游戏">太空射击</button>
              <button class="chip" type="button" data-example="贪吃蛇游戏">贪吃蛇</button>
              <button class="chip" type="button" data-example="打砖块游戏">打砖块</button>
              <button class="chip" type="button" data-example="迷宫逃脱游戏">迷宫逃脱</button>
            </div>

            <div class="field">
              <label for="extraRequirements">补充需求</label>
              <textarea id="extraRequirements" name="extraRequirements" maxlength="1200" placeholder="例如：像素风、三关、增加计时器、可爱角色"></textarea>
            </div>

            <div class="action-row">
              <button id="generateBtn" class="btn-primary" type="submit">生成并试玩</button>
              <button id="importSampleBtn" class="btn-ghost" type="button">导入炸弹人示例</button>
            </div>
          </form>
          <div id="message" class="message">准备就绪。</div>
        </div>
      </section>

      <section class="surface" aria-label="游戏库">
        <div class="surface-head">
          <h2>游戏库</h2>
          <div class="library-tools">
            <input id="searchInput" type="search" placeholder="搜索游戏">
          </div>
        </div>
        <div class="surface-body">
          <div id="emptyState" class="empty-state hidden">还没有游戏。</div>
          <div id="gameList" class="game-list"></div>
        </div>
      </section>
    </section>
  </main>

  <div id="previewModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="试玩窗口">
    <div class="preview-shell">
      <div class="preview-bar">
        <div id="previewTitle" class="preview-title">试玩</div>
        <div class="preview-actions">
          <button id="reloadPreviewBtn" class="btn-blue" type="button">重新加载</button>
          <button id="downloadPreviewBtn" class="btn-green" type="button">下载</button>
          <button id="closePreviewBtn" class="btn-ghost" type="button">关闭</button>
        </div>
      </div>
      <iframe id="gamePreview" title="游戏试玩" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="AI 修改游戏">
    <form id="editForm" class="dialog">
      <div id="editTitle" class="dialog-head">AI 修改</div>
      <div class="dialog-body">
        <div class="field">
          <label for="editInstruction">修改要求</label>
          <textarea id="editInstruction" maxlength="1200" placeholder="例如：增加计时器和下一关，失败后显示最终分数" required></textarea>
        </div>
        <div class="dialog-actions">
          <button id="cancelEditBtn" class="btn-ghost" type="button">取消</button>
          <button id="submitEditBtn" class="btn-primary" type="submit">提交修改</button>
        </div>
      </div>
    </form>
  </div>

  <div id="busyLayer" class="busy-layer hidden">
    <div class="busy-box">
      <div id="busyText" class="busy-title">正在生成</div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressPercent">0%</span>
        <span id="progressEta">预计剩余 --</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const DB_NAME = "ai-mini-game-workshop";
      const DB_VERSION = 1;
      const STORE = "games";
      const SAMPLE_ID = "sample-bomberman";

      const els = {
        providerStatus: document.getElementById("providerStatus"),
        generateForm: document.getElementById("generateForm"),
        gameName: document.getElementById("gameName"),
        extraRequirements: document.getElementById("extraRequirements"),
        generateBtn: document.getElementById("generateBtn"),
        importSampleBtn: document.getElementById("importSampleBtn"),
        message: document.getElementById("message"),
        searchInput: document.getElementById("searchInput"),
        emptyState: document.getElementById("emptyState"),
        gameList: document.getElementById("gameList"),
        previewModal: document.getElementById("previewModal"),
        previewTitle: document.getElementById("previewTitle"),
        gamePreview: document.getElementById("gamePreview"),
        reloadPreviewBtn: document.getElementById("reloadPreviewBtn"),
        downloadPreviewBtn: document.getElementById("downloadPreviewBtn"),
        closePreviewBtn: document.getElementById("closePreviewBtn"),
        editModal: document.getElementById("editModal"),
        editForm: document.getElementById("editForm"),
        editTitle: document.getElementById("editTitle"),
        editInstruction: document.getElementById("editInstruction"),
        cancelEditBtn: document.getElementById("cancelEditBtn"),
        submitEditBtn: document.getElementById("submitEditBtn"),
        busyLayer: document.getElementById("busyLayer"),
        busyText: document.getElementById("busyText"),
        progressFill: document.getElementById("progressFill"),
        progressPercent: document.getElementById("progressPercent"),
        progressEta: document.getElementById("progressEta")
      };

      let dbPromise = null;
      let games = [];
      let currentPreview = null;
      let currentEdit = null;
      let progressTimer = null;
      let progressStartedAt = 0;
      let progressEstimateMs = 180000;

      init();

      function init() {
        wireEvents();
        loadHealth();
        refreshGames();
      }

      function wireEvents() {
        els.generateForm.addEventListener("submit", onGenerate);
        els.importSampleBtn.addEventListener("click", importSample);
        els.searchInput.addEventListener("input", renderGames);
        els.reloadPreviewBtn.addEventListener("click", reloadPreview);
        els.downloadPreviewBtn.addEventListener("click", () => currentPreview && downloadGame(currentPreview));
        els.closePreviewBtn.addEventListener("click", closePreview);
        els.cancelEditBtn.addEventListener("click", closeEdit);
        els.editForm.addEventListener("submit", submitEdit);

        document.querySelectorAll("[data-example]").forEach((button) => {
          button.addEventListener("click", () => {
            els.gameName.value = button.dataset.example;
            els.gameName.focus();
          });
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            if (!els.editModal.classList.contains("hidden")) closeEdit();
            else if (!els.previewModal.classList.contains("hidden")) closePreview();
          }
        });
      }

      async function loadHealth() {
        try {
          const health = await requestJson("/api/health");
          els.providerStatus.textContent = health.hasKey
            ? `DeepSeek ${health.model} 已连接`
            : `DeepSeek ${health.model} 未配置 Key`;
          els.providerStatus.classList.toggle("ready", Boolean(health.hasKey));
          els.providerStatus.classList.toggle("warn", !health.hasKey);
          if (!health.hasKey) {
            showMessage("请先在终端设置 DeepSeek API Key，再生成新游戏。", "error");
          }
        } catch (error) {
          els.providerStatus.textContent = "后端未连接";
          els.providerStatus.classList.add("warn");
          showMessage(error.message, "error");
        }
      }

      async function onGenerate(event) {
        event.preventDefault();
        const gameName = els.gameName.value.trim();
        const extraRequirements = els.extraRequirements.value.trim();
        if (!gameName) return;

        setBusy(true, "DeepSeek 正在生成游戏", 240000);
        showMessage("生成中，请稍等。", "");
        try {
          const data = await requestJson("/api/generate", {
            method: "POST",
            body: { gameName, extraRequirements }
          });

          const now = new Date().toISOString();
          const game = {
            id: createId(),
            title: gameName,
            gameName,
            html: data.html,
            createdAt: now,
            updatedAt: now,
            version: 1
          };
          await putGame(game);
          await refreshGames();
          openPreview(game);
          showMessage(`已生成：${game.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function submitEdit(event) {
        event.preventDefault();
        if (!currentEdit) return;
        const instruction = els.editInstruction.value.trim();
        if (!instruction) return;

        setBusy(true, "DeepSeek 正在修改游戏", 210000);
        try {
          const data = await requestJson("/api/modify", {
            method: "POST",
            body: {
              title: currentEdit.title,
              html: currentEdit.html,
              instruction
            }
          });

          const updated = {
            ...currentEdit,
            html: data.html,
            version: Number(currentEdit.version || 1) + 1,
            updatedAt: new Date().toISOString()
          };
          await putGame(updated);
          closeEdit();
          await refreshGames();
          openPreview(updated);
          showMessage(`已修改：${updated.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function importSample() {
        setBusy(true, "正在导入示例", 3500);
        try {
          const response = await fetch("/samples/bomberman.html", { cache: "no-store" });
          if (!response.ok) throw new Error("无法读取炸弹人示例。");
          const html = await response.text();
          const existing = games.find((game) => game.id === SAMPLE_ID);
          const now = new Date().toISOString();
          const sample = {
            id: SAMPLE_ID,
            title: "炸弹人示例",
            gameName: "Bomberman / 炸弹人",
            html,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
            version: existing ? Number(existing.version || 1) + 1 : 1
          };
          await putGame(sample);
          await refreshGames();
          openPreview(sample);
          showMessage("炸弹人示例已导入。", "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function refreshGames() {
        games = await getAllGames();
        games.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        renderGames();
      }

      function renderGames() {
        const query = els.searchInput.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.gameName}`.toLowerCase();
          return !query || haystack.includes(query);
        });

        els.gameList.textContent = "";
        els.emptyState.classList.toggle("hidden", filtered.length > 0);

        for (const game of filtered) {
          els.gameList.appendChild(createGameRow(game));
        }
      }

      function createGameRow(game) {
        const row = document.createElement("article");
        row.className = "game-row";

        const info = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = game.title;

        const meta = document.createElement("div");
        meta.className = "meta";
        [
          `v${game.version || 1}`,
          formatDate(game.updatedAt),
          formatBytes(game.html.length),
          game.gameName || "小游戏"
        ].forEach((text) => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = text;
          meta.appendChild(tag);
        });

        info.append(title, meta);

        const actions = document.createElement("div");
        actions.className = "row-actions";
        actions.append(
          makeButton("试玩", "btn-blue", () => openPreview(game)),
          makeButton("AI 修改", "btn-primary", () => openEdit(game)),
          makeButton("下载", "btn-green", () => downloadGame(game)),
          makeButton("重命名", "btn-ghost", () => renameGame(game)),
          makeButton("删除", "btn-danger", () => deleteGame(game))
        );

        row.append(info, actions);
        return row;
      }

      function makeButton(text, className, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = text;
        button.addEventListener("click", onClick);
        return button;
      }

      function openPreview(game) {
        currentPreview = game;
        els.previewTitle.textContent = `${game.title} · v${game.version || 1}`;
        els.gamePreview.srcdoc = "";
        els.previewModal.classList.remove("hidden");
        setTimeout(() => {
          els.gamePreview.srcdoc = game.html;
          els.gamePreview.focus();
        }, 0);
      }

      function reloadPreview() {
        if (!currentPreview) return;
        els.gamePreview.srcdoc = "";
        setTimeout(() => {
          els.gamePreview.srcdoc = currentPreview.html;
        }, 0);
      }

      function closePreview() {
        els.previewModal.classList.add("hidden");
        els.gamePreview.srcdoc = "";
        currentPreview = null;
      }

      function openEdit(game) {
        currentEdit = game;
        els.editTitle.textContent = `AI 修改：${game.title}`;
        els.editInstruction.value = "";
        els.editModal.classList.remove("hidden");
        setTimeout(() => els.editInstruction.focus(), 0);
      }

      function closeEdit() {
        els.editModal.classList.add("hidden");
        els.editInstruction.value = "";
        currentEdit = null;
      }

      async function renameGame(game) {
        const title = prompt("新的游戏名称", game.title);
        if (title == null) return;
        const nextTitle = title.trim();
        if (!nextTitle) return;
        const updated = { ...game, title: nextTitle.slice(0, 120), updatedAt: new Date().toISOString() };
        await putGame(updated);
        await refreshGames();
        showMessage("已重命名。", "ok");
      }

      async function deleteGame(game) {
        if (!confirm(`删除“${game.title}”？`)) return;
        await removeGame(game.id);
        if (currentPreview?.id === game.id) closePreview();
        await refreshGames();
        showMessage("已删除。", "ok");
      }

      function downloadGame(game) {
        const blob = new Blob([game.html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "index.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          method: options.method || "GET",
          headers: options.body ? { "Content-Type": "application/json" } : undefined,
          body: options.body ? JSON.stringify(options.body) : undefined
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = data.detail ? `：${data.detail}` : "";
          throw new Error((data.error || "请求失败") + detail);
        }
        return data;
      }

      function openDb() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE)) {
              const store = db.createObjectStore(STORE, { keyPath: "id" });
              store.createIndex("updatedAt", "updatedAt");
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return dbPromise;
      }

      async function getAllGames() {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const request = tx.objectStore(STORE).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      async function putGame(game) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(game);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      async function removeGame(id) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      function setBusy(isBusy, text, estimateMs) {
        stopProgressTimer();
        els.busyText.textContent = text || "正在处理";
        els.busyLayer.classList.toggle("hidden", !isBusy);
        els.generateBtn.disabled = isBusy;
        els.submitEditBtn.disabled = isBusy;
        if (isBusy) {
          startProgressTimer(estimateMs || 180000);
        } else {
          els.progressFill.style.width = "100%";
          els.progressPercent.textContent = "100%";
          els.progressEta.textContent = "已完成";
        }
      }

      function startProgressTimer(estimateMs) {
        progressStartedAt = Date.now();
        progressEstimateMs = Math.max(estimateMs, 3000);
        updateProgress();
        progressTimer = window.setInterval(updateProgress, 1000);
      }

      function stopProgressTimer() {
        if (progressTimer) {
          window.clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function updateProgress() {
        const elapsed = Date.now() - progressStartedAt;
        const ratio = elapsed / progressEstimateMs;
        const eased = 1 - Math.pow(1 - Math.min(ratio, 1), 2.4);
        const percent = ratio <= 1 ? Math.min(92, Math.max(3, Math.round(eased * 92))) : 92;
        const remaining = Math.max(0, progressEstimateMs - elapsed);

        els.progressFill.style.width = `${percent}%`;
        els.progressPercent.textContent = `${percent}%`;
        els.progressEta.textContent = remaining > 0
          ? `预计剩余 ${formatDuration(remaining)}`
          : `已超出预计 ${formatDuration(elapsed - progressEstimateMs)}，继续等待`;
      }

      function showMessage(text, type) {
        els.message.textContent = text;
        els.message.classList.toggle("error", type === "error");
        els.message.classList.toggle("ok", type === "ok");
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `game-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function formatDate(value) {
        const date = value ? new Date(value) : new Date();
        if (Number.isNaN(date.getTime())) return "未知时间";
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function formatBytes(chars) {
        const bytes = new Blob(["x".repeat(chars)]).size;
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function formatDuration(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        if (minutes <= 0) return `${seconds}s`;
        return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
      }
    })();
  </script>
</body>
