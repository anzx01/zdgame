<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 小游戏工坊</title>
  <style>
    :root {
      --ink: #080808;
      --paper: #fff8e8;
      --cream: #ffe86b;
      --red: #ff4f3f;
      --green: #00c875;
      --cyan: #00c2ff;
      --yellow: #ffe500;
      --blue: #3157ff;
      --pink: #ff6bd6;
      --line: #080808;
      --muted: #383838;
      --panel: #fff8e8;
      --shadow: #080808;
      --radius: 4px;
      --hard-shadow: 10px 10px 0 var(--line);
      --soft-shadow: 0 18px 48px rgba(83, 70, 45, 0.18);
    }

    [data-theme="storybook"] {
      --ink: #2e3328;
      --paper: #fff8df;
      --cream: #f7e9b6;
      --red: #d86b4c;
      --green: #78ad6f;
      --cyan: #9ac9c1;
      --yellow: #f4c96b;
      --blue: #5f82a5;
      --pink: #e7a6a8;
      --line: #5a4b36;
      --muted: #75694f;
      --panel: rgba(255, 248, 223, 0.92);
      --shadow: rgba(83, 70, 45, 0.2);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(8, 8, 8, 0.12) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(0deg, rgba(8, 8, 8, 0.12) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(135deg, #ffe500 0 28%, #00c2ff 28% 54%, #ff6bd6 54% 77%, #fff8e8 77%);
      font-family: Impact, Haettenschweiler, "Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif;
      transition: background 260ms ease, color 260ms ease;
    }

    [data-theme="storybook"] body {
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.8) 0 7%, transparent 7.5%),
        radial-gradient(circle at 82% 18%, rgba(255, 244, 201, 0.9) 0 9%, transparent 9.5%),
        linear-gradient(160deg, rgba(120, 173, 111, 0.35), transparent 36%),
        linear-gradient(20deg, rgba(154, 201, 193, 0.55), transparent 42%),
        #f6dfa9;
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      padding: 18px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 4px solid var(--line);
      background: var(--yellow);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
      padding: 11px 15px;
      box-shadow: 6px 6px 0 var(--line);
      border-radius: var(--radius);
      text-transform: uppercase;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #ffe377;
    }

    button:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--line);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #ff725f;
    }

    .btn-green {
      background: var(--green);
      color: var(--ink);
    }

    .btn-blue {
      background: var(--cyan);
      color: #fff;
    }

    .btn-danger {
      background: var(--ink);
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
    }

    .app {
      width: min(1240px, 100%);
      margin: 0 auto;
    }

    .topline {
      display: grid;
      grid-template-columns: 1fr minmax(240px, auto);
      align-items: stretch;
      gap: 14px;
      margin-bottom: 14px;
    }

    .top-controls {
      display: grid;
      gap: 10px;
      align-content: center;
    }

    .theme-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      border: 5px solid var(--line);
      background: #fff;
      box-shadow: 8px 8px 0 var(--line);
      padding: 7px;
      border-radius: var(--radius);
    }

    .theme-switch button {
      box-shadow: none;
      border-width: 3px;
      padding: 9px 10px;
      background: #fff;
      font-size: 13px;
    }

    .theme-switch button.active {
      background: var(--yellow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      border: 5px solid var(--line);
      background: var(--paper);
      box-shadow: 10px 10px 0 var(--line);
      padding: 18px;
      transform: rotate(-0.6deg);
    }

    [data-theme="storybook"] .brand {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.78), rgba(255, 248, 223, 0.96)),
        var(--panel);
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: rotate(-0.25deg);
    }

    .brand-mark {
      width: 68px;
      height: 68px;
      flex: 0 0 68px;
      border: 5px solid var(--line);
      background:
        linear-gradient(90deg, transparent 0 24px, rgba(8, 8, 8, 0.22) 24px 29px, transparent 29px),
        linear-gradient(0deg, var(--red) 0 50%, var(--yellow) 50%);
      box-shadow: 7px 7px 0 var(--line);
      border-radius: var(--radius);
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .brand-mark::before {
      width: 16px;
      height: 7px;
      left: 8px;
      top: 11px;
      box-shadow: 21px 0 0 var(--ink), 10px 22px 0 var(--ink);
    }

    .brand-mark::after {
      width: 8px;
      height: 8px;
      right: 8px;
      bottom: 8px;
      background: var(--cyan);
      border: 3px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6.6vw, 78px);
      line-height: 0.9;
      letter-spacing: 0;
      text-shadow: 5px 5px 0 var(--yellow), 9px 9px 0 var(--pink);
    }

    [data-theme="storybook"] h1 {
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--ink);
      font-weight: 900;
      font-size: clamp(14px, 1.45vw, 18px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .status-pill {
      justify-self: end;
      align-self: center;
      border: 5px solid var(--line);
      background: var(--green);
      box-shadow: 8px 8px 0 var(--line);
      padding: 14px 16px;
      border-radius: var(--radius);
      font-weight: 900;
      white-space: nowrap;
      transform: rotate(1deg);
    }

    [data-theme="storybook"] .status-pill,
    [data-theme="storybook"] .theme-switch {
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: none;
    }

    .status-pill.ready {
      background: var(--green);
    }

    .status-pill.warn {
      background: var(--red);
      color: #fff;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 0 0 18px;
    }

    .intro-card {
      border: 5px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 8px 8px 0 var(--line);
      min-height: 152px;
      position: relative;
      overflow: hidden;
      transform: rotate(0.35deg);
    }

    [data-theme="storybook"] .intro-card,
    [data-theme="storybook"] .surface,
    [data-theme="storybook"] .game-row,
    [data-theme="storybook"] .dialog,
    [data-theme="storybook"] .preview-shell,
    [data-theme="storybook"] .busy-box {
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: none;
    }

    .intro-card:nth-child(1) {
      background: var(--yellow);
      transform: rotate(-0.8deg);
    }

    .intro-card:nth-child(2) {
      background: var(--cyan);
    }

    .intro-card:nth-child(3) {
      background: var(--pink);
      transform: rotate(0.8deg);
    }

    .intro-card strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .intro-card span {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 900;
    }

    .mini-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .mini-list span {
      border: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.64);
      border-radius: var(--radius);
      padding: 5px 7px;
      font-size: 13px;
      line-height: 1.2;
    }

    .mega-number {
      display: block;
      margin: 2px 0 4px;
      font-size: clamp(64px, 12vw, 132px);
      line-height: 0.82;
      letter-spacing: 0;
      color: var(--ink);
      text-shadow: 5px 5px 0 #fff, 9px 9px 0 var(--red);
    }

    .stamp {
      position: absolute;
      right: -14px;
      top: 14px;
      border: 4px solid var(--line);
      background: var(--red);
      color: #fff;
      padding: 7px 13px;
      font-size: 14px;
      font-weight: 900;
      transform: rotate(12deg);
      box-shadow: 5px 5px 0 var(--line);
    }

    [data-theme="storybook"] .stamp {
      border-width: 2px;
      box-shadow: 0 6px 18px rgba(83, 70, 45, 0.2);
      border-radius: 999px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 0.86fr) minmax(430px, 1.14fr);
      gap: 18px;
      align-items: start;
    }

    .surface {
      border: 5px solid var(--line);
      background: var(--panel);
      box-shadow: 10px 10px 0 var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .surface:nth-child(1) {
      transform: rotate(-0.25deg);
    }

    .surface:nth-child(2) {
      transform: rotate(0.22deg);
    }

    .surface-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: var(--ink);
      color: #fff;
      border-bottom: 5px solid var(--line);
    }

    .surface-head h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .surface-body {
      padding: 16px;
    }

    .library-body {
      padding: 0;
    }

    .library-scroll {
      max-height: min(62vh, 650px);
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--red) rgba(255, 255, 255, 0.7);
    }

    .library-scroll::-webkit-scrollbar {
      width: 12px;
    }

    .library-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.7);
      border-left: 3px solid var(--line);
    }

    .library-scroll::-webkit-scrollbar-thumb {
      background: var(--red);
      border: 3px solid var(--line);
      border-radius: 999px;
    }

    [data-theme="storybook"] .library-scroll {
      max-height: min(64vh, 680px);
      scrollbar-color: var(--green) rgba(255, 248, 223, 0.78);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      border: 4px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      outline: none;
      padding: 12px 13px;
      font-weight: 900;
      box-shadow: 5px 5px 0 rgba(8, 8, 8, 0.18);
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 5px 5px 0 var(--line), 0 0 0 5px var(--yellow);
    }

    .example-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 16px;
    }

    .chip {
      padding: 7px 10px;
      border: 3px solid var(--line);
      background: var(--cream);
      border-radius: var(--radius);
      box-shadow: 4px 4px 0 var(--line);
      font-size: 13px;
      font-weight: 900;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .message {
      min-height: 45px;
      margin-top: 14px;
      border: 4px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 10px 12px;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 5px 5px 0 rgba(8, 8, 8, 0.18);
    }

    .message.error {
      background: #ffe0dc;
      color: #7a2018;
    }

    .message.ok {
      background: #dcffe4;
      color: #155c33;
    }

    .library-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(360px, 100%);
    }

    .library-count {
      flex: 0 0 auto;
      border: 3px solid var(--line);
      background: var(--yellow);
      padding: 7px 9px;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 4px 4px 0 var(--line);
      border-radius: var(--radius);
    }

    .library-tools input {
      padding: 9px 11px;
      border-width: 2px;
      box-shadow: none;
      font-size: 14px;
    }

    .game-list {
      display: grid;
      gap: 10px;
    }

    .game-row {
      border: 4px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      box-shadow: 6px 6px 0 var(--line);
    }

    [data-theme="storybook"] button,
    [data-theme="storybook"] input,
    [data-theme="storybook"] textarea,
    [data-theme="storybook"] .message,
    [data-theme="storybook"] .chip,
    [data-theme="storybook"] .library-count {
      border-width: 2px;
      box-shadow: 0 8px 20px rgba(83, 70, 45, 0.14);
    }

    [data-theme="storybook"] button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 14px rgba(83, 70, 45, 0.16);
    }

    .game-row h3 {
      margin: 0 0 5px;
      font-size: 20px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .game-hook {
      margin: 7px 0 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 900;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .last-result {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      margin-top: 7px;
      border: 2px solid var(--line);
      background: #dcffe4;
      color: #155c33;
      border-radius: var(--radius);
      padding: 4px 7px;
      font-size: 12px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .tag.viral {
      background: #fff;
      color: var(--ink);
    }

    .tag {
      border: 2px solid var(--line);
      background: var(--yellow);
      border-radius: var(--radius);
      padding: 3px 7px;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 430px;
    }

    .row-actions button {
      padding: 8px 10px;
      font-size: 13px;
      border-width: 2px;
      box-shadow: 0 3px 0 var(--line);
    }

    .empty-state {
      border: 4px dashed var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 28px;
      text-align: center;
      font-weight: 900;
      color: #554b38;
    }

    .hidden {
      display: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8, 8, 8, 0.76);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .preview-shell {
      width: min(1180px, 100%);
      height: min(780px, calc(100vh - 36px));
      display: flex;
      flex-direction: column;
      border: 5px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 12px 12px 0 var(--line);
      overflow: hidden;
    }

    .preview-bar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--ink);
      color: #fff;
      border-bottom: 5px solid var(--line);
    }

    .preview-title {
      min-width: 0;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .preview-actions button {
      padding: 8px 10px;
      border-width: 2px;
      box-shadow: 0 3px 0 var(--line);
      font-size: 13px;
    }

    .preview-notice {
      flex: 0 0 auto;
      display: none;
      border-bottom: 3px solid var(--line);
      background: #ffe0dc;
      color: #7a2018;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
      max-height: min(96px, 18vh);
      overflow-y: auto;
    }

    .preview-notice.visible {
      display: block;
    }

    .preview-notice.ok {
      background: #dcffe4;
      color: #155c33;
    }

    .preview-shell iframe {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }

    .dialog {
      width: min(560px, 100%);
      border: 5px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 10px 10px 0 var(--line);
      overflow: hidden;
    }

    .dialog-head {
      background: var(--ink);
      color: #fff;
      padding: 13px 15px;
      border-bottom: 4px solid var(--line);
      font-weight: 900;
    }

    .dialog-body {
      padding: 16px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .source-view {
      width: 100%;
      min-height: min(58vh, 520px);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      white-space: pre;
    }

    .busy-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(255, 229, 0, 0.52);
      backdrop-filter: blur(2px);
    }

    .busy-box {
      min-width: min(420px, calc(100vw - 36px));
      border: 5px solid var(--line);
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 10px 10px 0 var(--line);
      font-weight: 900;
    }

    .busy-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 18px;
      border: 3px solid #fff9df;
      background: rgba(255, 249, 223, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--green), var(--cyan));
      transition: width 360ms ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #fff4cf;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .topline,
      .intro-grid,
      .workspace {
        grid-template-columns: 1fr;
      }

      .brand {
        align-items: flex-start;
        transform: none;
      }

      h1 {
        font-size: clamp(40px, 16vw, 72px);
      }

      .status-pill {
        justify-self: start;
        transform: none;
      }

      .top-controls {
        grid-template-columns: 1fr;
      }

      .library-scroll {
        max-height: 58vh;
      }

      .intro-card,
      .surface {
        transform: none !important;
      }

      .mega-number {
        font-size: clamp(72px, 24vw, 116px);
      }

      .game-row {
        grid-template-columns: 1fr;
      }

      .row-actions {
        justify-content: start;
        max-width: none;
      }

      .preview-bar {
        grid-template-columns: 1fr;
      }

      .preview-actions {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI 小游戏工坊</h1>
          <p class="subtitle">VIRAL GAME MACHINE · 一句话爆点、打开即玩、结果可晒的 HTML 小游戏</p>
        </div>
      </div>
      <div class="top-controls">
        <div id="providerStatus" class="status-pill">DeepSeek 检测中</div>
        <div class="theme-switch" aria-label="界面风格切换">
          <button id="neoThemeBtn" type="button" data-theme-choice="neo">NEO</button>
          <button id="storyThemeBtn" type="button" data-theme-choice="storybook">童话</button>
        </div>
      </div>
    </header>

    <section class="workspace">
      <section class="surface" aria-label="生成游戏">
        <div class="surface-head">
          <h2>生成新游戏</h2>
          <span>Hook + Challenge + Share</span>
        </div>
        <div class="surface-body">
          <form id="generateForm">
            <div class="field">
              <label for="gameName">游戏名称</label>
              <input id="gameName" name="gameName" autocomplete="off" maxlength="80" placeholder="例如：画一个完美圆" required>
            </div>

            <div class="example-grid" aria-label="快速示例">
              <button class="chip" type="button" data-example="画一个完美圆" data-extra="用户拖动鼠标或手指画圆，结束后给出百分制圆度、称号、结果卡和分享文案。">完美圆</button>
              <button class="chip" type="button" data-example="密码规则地狱" data-extra="输入密码，规则逐步变得离谱但可理解；展示当前规则、失败原因、最高通过规则数和吐槽式分享文案。">密码地狱</button>
              <button class="chip" type="button" data-example="真假 Logo 挑战" data-extra="每轮展示两个极简品牌标记，让玩家判断哪个更像真 Logo；10 题结算正确率和称号。">真假判断</button>
              <button class="chip" type="button" data-example="无限词语组合实验" data-extra="从四个基础词开始，两两组合生成新词；结果要离谱、有收藏列表、发现数量和分享文案。">组合实验</button>
              <button class="chip" type="button" data-example="颜色记忆挑战" data-extra="先看 2 秒目标颜色，再用滑块还原；按色差给分、称号、结果卡和再挑战按钮。">颜色记忆</button>
            </div>

            <div class="field">
              <label for="extraRequirements">爆款补充</label>

            <div class="action-row">

            </div>

          <div id="message" class="message">准备就绪。输入一个能一句话讲清楚的挑战。</div>
        </div>
      </section>

      <section class="surface" aria-label="游戏库">
        <div class="surface-head">
          <h2>游戏库</h2>
          <div class="library-tools">
            <span id="libraryCount" class="library-count">0 个</span>
            <input id="searchInput" type="search" placeholder="搜索游戏">
          </div>
        </div>
        <div class="surface-body library-body">
          <div class="library-scroll">
            <div id="emptyState" class="empty-state hidden">还没有游戏。</div>
            <div id="gameList" class="game-list"></div>
          </div>
        </div>

    </section>
  </main>

  <div id="previewModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="试玩窗口">
    <div class="preview-shell">
      <div class="preview-bar">
        <div id="previewTitle" class="preview-title">试玩</div>
        <div class="preview-actions">
          <button id="reloadPreviewBtn" class="btn-blue" type="button">重新加载</button>
          <button id="repairPreviewBtn" class="btn-primary" type="button">修复显示</button>
          <button id="copyShareBtn" class="btn-green" type="button">复制分享</button>

          <button id="downloadPreviewBtn" class="btn-green" type="button">下载</button>
          <button id="closePreviewBtn" class="btn-ghost" type="button">关闭</button>
        </div>
      </div>
      <div id="previewNotice" class="preview-notice"></div>
      <iframe id="gamePreview" title="游戏试玩" referrerpolicy="no-referrer"></iframe>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="AI 修改游戏">
    <form id="editForm" class="dialog">
      <div id="editTitle" class="dialog-head">AI 修改</div>
      <div class="dialog-body">
        <div class="field">
          <label for="editInstruction">修改要求</label>
          <textarea id="editInstruction" maxlength="1200" placeholder="例如：增加计时器和下一关，失败后显示最终分数" required></textarea>

  <div id="sourceModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="查看源码">

      <div class="dialog-head">当前游戏源码</div>

        <textarea id="sourceText" class="source-view" readonly></textarea>

  <div id="busyLayer" class="busy-layer hidden">
    <div class="busy-box">
      <div id="busyText" class="busy-title">正在生成</div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressPercent">0%</span>
        <span id="progressEta">预计剩余 --</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const DB_NAME = "ai-mini-game-workshop";
      const DB_VERSION = 1;
      const STORE = "games";
      const SAMPLE_ID = "sample-bomberman";
      const THEME_KEY = "ai-mini-game-workshop-theme";

      const els = {
        providerStatus: document.getElementById("providerStatus"),
        neoThemeBtn: document.getElementById("neoThemeBtn"),
        storyThemeBtn: document.getElementById("storyThemeBtn"),
        libraryCount: document.getElementById("libraryCount"),
        generateForm: document.getElementById("generateForm"),
        gameName: document.getElementById("gameName"),
        extraRequirements: document.getElementById("extraRequirements"),
        generateBtn: document.getElementById("generateBtn"),
        importSampleBtn: document.getElementById("importSampleBtn"),
        message: document.getElementById("message"),
        searchInput: document.getElementById("searchInput"),
        emptyState: document.getElementById("emptyState"),
        gameList: document.getElementById("gameList"),
        previewModal: document.getElementById("previewModal"),
        previewTitle: document.getElementById("previewTitle"),
        previewNotice: document.getElementById("previewNotice"),
        gamePreview: document.getElementById("gamePreview"),
        reloadPreviewBtn: document.getElementById("reloadPreviewBtn"),
        repairPreviewBtn: document.getElementById("repairPreviewBtn"),
        copyShareBtn: document.getElementById("copyShareBtn"),
        openWindowBtn: document.getElementById("openWindowBtn"),
        viewSourceBtn: document.getElementById("viewSourceBtn"),
        downloadPreviewBtn: document.getElementById("downloadPreviewBtn"),
        closePreviewBtn: document.getElementById("closePreviewBtn"),
        editModal: document.getElementById("editModal"),
        editForm: document.getElementById("editForm"),
        editTitle: document.getElementById("editTitle"),
        editInstruction: document.getElementById("editInstruction"),
        cancelEditBtn: document.getElementById("cancelEditBtn"),
        submitEditBtn: document.getElementById("submitEditBtn"),
        sourceModal: document.getElementById("sourceModal"),
        sourceText: document.getElementById("sourceText"),
        closeSourceBtn: document.getElementById("closeSourceBtn"),
        busyLayer: document.getElementById("busyLayer"),
        busyText: document.getElementById("busyText"),
        progressFill: document.getElementById("progressFill"),
        progressPercent: document.getElementById("progressPercent"),
        progressEta: document.getElementById("progressEta")
      };

      let dbPromise = null;
      let games = [];
      let currentPreview = null;
      let currentPreviewUrl = "";
      let currentEdit = null;
      let currentPreviewErrors = [];
      let currentPreviewDiagnostics = [];
      let progressTimer = null;
      let progressStartedAt = 0;
      let progressEstimateMs = 180000;

      init();

      function init() {
        applyTheme(localStorage.getItem(THEME_KEY) || "neo");
        wireEvents();
        loadHealth();
        refreshGames();
      }

      function wireEvents() {
        els.generateForm.addEventListener("submit", onGenerate);
        els.neoThemeBtn.addEventListener("click", () => setTheme("neo"));
        els.storyThemeBtn.addEventListener("click", () => setTheme("storybook"));
        els.importSampleBtn.addEventListener("click", importSample);
        els.searchInput.addEventListener("input", renderGames);
        els.reloadPreviewBtn.addEventListener("click", reloadPreview);
        els.repairPreviewBtn.addEventListener("click", repairPreview);
        els.copyShareBtn.addEventListener("click", copyCurrentShareText);
        els.openWindowBtn.addEventListener("click", openPreviewWindow);
        els.viewSourceBtn.addEventListener("click", openSource);
        els.downloadPreviewBtn.addEventListener("click", () => currentPreview && downloadGame(currentPreview));
        els.closePreviewBtn.addEventListener("click", closePreview);
        els.cancelEditBtn.addEventListener("click", closeEdit);
        els.editForm.addEventListener("submit", submitEdit);
        els.closeSourceBtn.addEventListener("click", closeSource);

        document.querySelectorAll("[data-example]").forEach((button) => {
          button.addEventListener("click", () => {
            els.gameName.value = button.dataset.example;
            if (button.dataset.extra) {
              els.extraRequirements.value = button.dataset.extra;
            }
            els.gameName.focus();
          });
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            if (!els.sourceModal.classList.contains("hidden")) closeSource();
            else if (!els.editModal.classList.contains("hidden")) closeEdit();
            else if (!els.previewModal.classList.contains("hidden")) closePreview();
          }
        });

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || !currentPreview) return;
          if (data.source === "ai-game-workshop" && data.type === "result") {
            savePreviewResult(data).catch((error) => showPreviewNotice(`结果保存失败：${error.message}`));
            return;
          }
          if (data.source !== "game-preview") return;
          if (data.type === "error" || data.type === "unhandledrejection") {
            const message = String(data.message || "未知脚本错误");
            currentPreviewErrors.push(message);
            currentPreviewErrors = currentPreviewErrors.slice(-6);
            showPreviewNotice(`游戏脚本报错：${message}。可以点击“修复显示”。`);
          } else if (data.type === "probe") {
            currentPreviewDiagnostics.push(JSON.stringify(data.report));
            currentPreviewDiagnostics = currentPreviewDiagnostics.slice(-8);
            if (data.report && data.report.looksBlank) {
              showPreviewNotice(`试玩已加载，但检测到画面可能为空白：${data.report.reason}。可以点“新窗口”判断是否为 iframe 问题，或点“修复显示”。`);
            } else if (data.report && data.report.needsScrollToPlay) {
              showPreviewNotice("试玩已加载，但首屏没有可操作的游戏画面，主要内容可能被空白结果区推到下方。可以点击“修复显示”。");
            } else if (data.report && data.report.layout && data.report.layout.largePassivePanelCount > 0) {
              showPreviewNotice("试玩已加载，但首屏结果/状态区域过高，游戏控件不够靠前。可以点击“修复显示”。");
            }
          }
        });
      }

      function setTheme(theme) {
        applyTheme(theme);
        localStorage.setItem(THEME_KEY, theme);
      }

      function applyTheme(theme) {
        const safeTheme = theme === "storybook" ? "storybook" : "neo";
        document.documentElement.dataset.theme = safeTheme;
        els.neoThemeBtn.classList.toggle("active", safeTheme === "neo");
        els.storyThemeBtn.classList.toggle("active", safeTheme === "storybook");
      }

      function isRuleHeavyGame(text) {
        const value = String(text || "").toLowerCase();
        return [
          "象棋", "中国象棋", "xiangqi", "chinese chess",
          "国际象棋", "chess", "围棋", "go game", "五子棋", "gomoku",
          "黑白棋", "reversi", "othello", "跳棋", "checkers",
          "四子棋", "connect four", "数独", "sudoku", "麻将", "mahjong",
          "军棋", "斗兽棋", "扑克牌", "纸牌", "poker", "card game", "solitaire"
        ].some((keyword) => value.includes(keyword.toLowerCase()));
      }

      async function loadHealth() {
        try {
          const health = await requestJson("/api/health");
          els.providerStatus.textContent = health.hasKey
            ? `DeepSeek ${health.model} 已连接`
            : `DeepSeek ${health.model} 未配置 Key`;
          els.providerStatus.title = health.ruleModel
            ? `规则类游戏模型：${health.ruleModel}；Thinking：${health.thinking || "enabled"}；Reasoning：${health.reasoningEffort || "high"}`
            : "";
          els.providerStatus.classList.toggle("ready", Boolean(health.hasKey));
          els.providerStatus.classList.toggle("warn", !health.hasKey);
          if (!health.hasKey) {
            showMessage("请先在终端设置 DeepSeek API Key，再生成新游戏。", "error");
          }
        } catch (error) {
          els.providerStatus.textContent = "后端未连接";
          els.providerStatus.classList.add("warn");
          showMessage(error.message, "error");
        }
      }

      async function onGenerate(event) {
        event.preventDefault();
        const gameName = els.gameName.value.trim();
        const extraRequirements = els.extraRequirements.value.trim();
        if (!gameName) return;

        const ruleHeavy = isRuleHeavyGame(`${gameName}\n${extraRequirements}`);
        setBusy(true, ruleHeavy ? "DeepSeek Think 正在生成规则游戏" : "DeepSeek 正在生成游戏", ruleHeavy ? 900000 : 300000);
        showMessage(ruleHeavy ? "后台正在生成、试玩、检查规则并自动修复。" : "后台正在生成、试玩并自动修复明显问题。", "");
        try {
          const data = await requestJson("/api/generate", {
            method: "POST",
            body: { gameName, extraRequirements }
          });

          const now = new Date().toISOString();
          const viralMeta = buildViralMeta(gameName, extraRequirements, data);
          const game = {
            id: createId(),
            title: gameName,
            gameName,
            html: data.html,
            createdAt: now,
            updatedAt: now,
            version: 1,
            ...viralMeta
          };
          await putGame(game);
          await refreshGames();
          openPreview(game);
          showMessage(data.repaired ? `已生成：${game.title}（已后台修复）` : `已生成：${game.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function submitEdit(event) {
        event.preventDefault();
        if (!currentEdit) return;
        const instruction = els.editInstruction.value.trim();
        if (!instruction) return;

        const ruleHeavy = isRuleHeavyGame(`${currentEdit.title}\n${instruction}`);
        setBusy(true, ruleHeavy ? "DeepSeek Think 正在修改规则游戏" : "DeepSeek 正在修改游戏", ruleHeavy ? 900000 : 300000);
        try {
          const data = await requestJson("/api/modify", {
            method: "POST",
            body: {
              title: currentEdit.title,
              html: currentEdit.html,
              instruction
            }
          });

          const updated = {
            ...currentEdit,
            html: data.html,
            version: Number(currentEdit.version || 1) + 1,
            updatedAt: new Date().toISOString(),
            ...buildViralMeta(currentEdit.title, instruction, data, currentEdit)
          };
          await putGame(updated);
          closeEdit();
          await refreshGames();
          openPreview(updated);
          showMessage(data.repaired ? `已修改：${updated.title}（已后台修复）` : `已修改：${updated.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function importSample() {
        setBusy(true, "正在导入示例", 3500);
        try {
          const response = await fetch("/samples/bomberman.html", { cache: "no-store" });
          if (!response.ok) throw new Error("无法读取炸弹人示例。");
          const html = await response.text();
          const existing = games.find((game) => game.id === SAMPLE_ID);
          const now = new Date().toISOString();
          const sample = {
            id: SAMPLE_ID,
            title: "炸弹人示例",
            gameName: "Bomberman / 炸弹人",
            html,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
            version: existing ? Number(existing.version || 1) + 1 : 1,
            ...buildViralMeta("炸弹人示例", "经典炸弹人挑战，清空敌人并晒出通关结果。", {}, existing)
          };
          await putGame(sample);
          await refreshGames();
          openPreview(sample);
          showMessage("炸弹人示例已导入。", "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function refreshGames() {
        games = await getAllGames();
        games.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        renderGames();
      }

      function renderGames() {
        const query = els.searchInput.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.gameName} ${game.hook || ""} ${(game.viralTags || []).join(" ")}`.toLowerCase();
          return !query || haystack.includes(query);
        });

        els.libraryCount.textContent = query
          ? `${filtered.length}/${games.length}`
          : `${games.length} 个`;
        els.gameList.textContent = "";
        els.emptyState.classList.toggle("hidden", filtered.length > 0);

        for (const game of filtered) {
          els.gameList.appendChild(createGameRow(game));
        }
      }

      function createGameRow(game) {
        const row = document.createElement("article");
        row.className = "game-row";

        const info = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = game.title;

        const hook = document.createElement("div");
        hook.className = "game-hook";
        hook.textContent = game.hook || inferHook(game.title, game.gameName);

        const meta = document.createElement("div");
        meta.className = "meta";
        const metaItems = [
          `v${game.version || 1}`,
          formatDate(game.updatedAt),
          ...(Array.isArray(game.viralTags) ? game.viralTags.slice(0, 3) : [])
        ];
        metaItems.forEach((text, index) => {
          const tag = document.createElement("span");
          tag.className = index >= 2 ? "tag viral" : "tag";
          tag.textContent = text;
          meta.appendChild(tag);
        });

        info.append(title, hook, meta);
        if (game.lastResult?.metric) {
          const result = document.createElement("div");
          result.className = "last-result";
          result.textContent = `上次结果：${game.lastResult.metric}`;
          info.appendChild(result);
        }

        const actions = document.createElement("div");
        actions.className = "row-actions";
        actions.append(
          makeButton("试玩", "btn-blue", () => openPreview(game)),
          makeButton("复制分享", "btn-green", () => copyShareText(getShareText(game), game)),
          makeButton("AI 修改", "btn-primary", () => openEdit(game)),
          makeButton("下载", "btn-green", () => downloadGame(game)),
          makeButton("重命名", "btn-ghost", () => renameGame(game)),
          makeButton("删除", "btn-danger", () => deleteGame(game))
        );

        row.append(info, actions);
        return row;
      }

      function makeButton(text, className, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = text;
        button.addEventListener("click", onClick);
        return button;
      }

      function buildViralMeta(title, extraText, data = {}, existing = {}) {
        const hook = normalizeInlineText(data.hook || existing.hook || inferHook(title, extraText), 120);
        const viralTags = normalizeTags(data.viralTags || data.tags || existing.viralTags || inferTags(title, extraText));
        const defaultShareText = normalizeInlineText(
          data.defaultShareText ||
          existing.defaultShareText ||
          `我刚生成了「${title}」：${hook}。来试试你能拿到什么结果。`,
          220
        );
        return {
          hook,
          viralTags,
          defaultShareText,
          lastResult: existing.lastResult || null
        };
      }

      function inferHook(title, extraText) {
        const text = `${title || ""} ${extraText || ""}`.toLowerCase();
        if (/圆|circle/.test(text)) return "画一个尽可能完美的圆，看系统给你多少分。";
        if (/密码|password/.test(text)) return "写一个满足越来越离谱规则的密码，看看你能撑到第几条。";
        if (/真假|logo|fake|ai or not|判断/.test(text)) return "在真假之间快速下注，最后晒出你的判断力。";
        if (/颜色|color/.test(text)) return "看一眼颜色，再凭记忆把它还原出来。";
        if (/组合|craft|合成|词/.test(text)) return "把两个东西组合起来，看看会长出什么离谱结果。";
        if (/象棋|棋|chess|gomoku|五子/.test(text)) return "用一局清晰可玩的规则挑战，证明你的策略还在线。";
        return `挑战「${title || "这个小游戏"}」，拿到一个值得截图分享的结果。`;
      }

      function inferTags(title, extraText) {
        const text = `${title || ""} ${extraText || ""}`.toLowerCase();
        if (/圆|circle/.test(text)) return ["手感挑战", "百分制", "结果卡"];
        if (/密码|password/.test(text)) return ["规则递进", "吐槽感", "可重玩"];
        if (/真假|logo|fake|判断/.test(text)) return ["真假判断", "正确率", "称号"];
        if (/颜色|color/.test(text)) return ["记忆挑战", "色差评分", "截图友好"];
        if (/组合|craft|合成|词/.test(text)) return ["无限组合", "发现数", "离谱结果"];
        return ["一句话挑战", "结果可晒", "可重玩"];
      }

      function normalizeTags(value) {
        const list = Array.isArray(value) ? value : String(value || "").split(/[,\s，、]+/);
        const clean = [];
        for (const item of list) {
          const text = normalizeInlineText(item, 12);
          if (text && !clean.includes(text)) clean.push(text);
          if (clean.length >= 4) break;
        }
        return clean.length ? clean : ["一句话挑战", "结果可晒", "可重玩"];
      }

      function normalizeInlineText(value, maxLength) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, maxLength);
      }

      async function savePreviewResult(data) {
        const metric = normalizeInlineText(data.metric || data.result || data.score || "已完成挑战", 100);
        const shareText = normalizeInlineText(data.shareText || getShareText(currentPreview), 280);
        const updated = {
          ...currentPreview,
          lastResult: {
            metric,
            shareText,
            at: new Date().toISOString()
          },
          updatedAt: new Date().toISOString()
        };
        currentPreview = updated;
        await putGame(updated);
        await refreshGames();
        showPreviewNotice(`已记录结果：${metric}`, "ok");
      }

      function getShareText(game) {
        if (!game) return "";
        if (game.lastResult?.shareText) return game.lastResult.shareText;
        return game.defaultShareText || `我刚玩了「${game.title}」：${game.hook || inferHook(game.title, game.gameName)}。来试试你的结果。`;
      }

      async function copyCurrentShareText() {
        if (!currentPreview) return;
        await copyShareText(getShareText(currentPreview), currentPreview);
      }

      async function copyShareText(text, game) {
        const mode = await copyText(text);
        const suffix = game?.lastResult?.metric ? `（${game.lastResult.metric}）` : "";
        showMessage(mode === "prompt" ? `已打开复制兜底：${game?.title || "分享文案"}${suffix}` : `分享文案已复制：${game?.title || "当前游戏"}${suffix}`, "ok");
      }

      async function copyText(text) {
        if (!text) return "empty";
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return "clipboard";
          } catch (error) {}
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          if (document.execCommand("copy")) return "fallback";
        } catch (error) {
        } finally {
          textarea.remove();
        }

        window.prompt("复制下面的分享文案", text);
        return "prompt";
      }

      function openPreview(game) {
        currentPreview = game;
        currentPreviewErrors = [];
        currentPreviewDiagnostics = [];
        clearPreviewNotice();
        els.previewTitle.textContent = `${game.title} · v${game.version || 1}`;
        clearPreviewFrame();
        els.previewModal.classList.remove("hidden");
        setTimeout(() => {
          renderPreviewFrame(game.html);
          els.gamePreview.focus();
        }, 0);
      }

      function reloadPreview() {
        if (!currentPreview) return;
        currentPreviewErrors = [];
        currentPreviewDiagnostics = [];
        clearPreviewNotice();
        clearPreviewFrame();
        setTimeout(() => {
          renderPreviewFrame(currentPreview.html);
        }, 0);
      }

      function closePreview() {
        els.previewModal.classList.add("hidden");
        clearPreviewFrame();
        currentPreview = null;
        currentPreviewErrors = [];
        currentPreviewDiagnostics = [];
        clearPreviewNotice();
      }

      function renderPreviewFrame(html) {
        clearPreviewFrame();
        const blob = new Blob([instrumentPreviewHtml(html)], { type: "text/html;charset=utf-8" });
        currentPreviewUrl = URL.createObjectURL(blob);
        els.gamePreview.removeAttribute("srcdoc");
        els.gamePreview.removeAttribute("sandbox");
        els.gamePreview.src = currentPreviewUrl;
      }

      function clearPreviewFrame() {
        els.gamePreview.removeAttribute("srcdoc");
        els.gamePreview.src = "about:blank";
        if (currentPreviewUrl) {
          URL.revokeObjectURL(currentPreviewUrl);
          currentPreviewUrl = "";
        }
      }

      async function repairPreview() {
        if (!currentPreview) return;
        const errorText = currentPreviewErrors.length
          ? currentPreviewErrors.join("\n")
          : "预览 iframe 显示异常，可能是白屏、首屏大面积空白、游戏内容被推到折叠线下、Canvas 绘制、脚本异常或页面尺寸问题。";
        const diagnosticText = currentPreviewDiagnostics.length
          ? currentPreviewDiagnostics.join("\n")
          : "没有收到 iframe 自检数据。";
        const ruleHeavy = isRuleHeavyGame(`${currentPreview.title}\n${currentPreview.gameName || ""}`);
        setBusy(true, ruleHeavy ? "DeepSeek Think 正在修复规则游戏" : "DeepSeek 正在修复显示", ruleHeavy ? 900000 : 300000);
        try {
          const data = await requestJson("/api/modify", {
            method: "POST",
            body: {
              title: currentPreview.title,
              html: currentPreview.html,
              instruction: [
                "修复这个游戏在 iframe 试玩窗口中的显示问题：白屏、首屏大面积空白、主要游戏内容被空白结果区推到下方、或需要滚动才能开始玩。",
                "要求：启动后必须立刻显示可见且可操作的游戏画面；主游戏卡片、画布、棋盘、滑块、开始按钮或答题控件必须在首屏内；空的结果/记录/状态区要隐藏或压缩，不能占据大块高度；如果脚本报错请修复；如果没有报错但 body/canvas 为空，请补齐 DOM、Canvas 尺寸和首帧绘制；不要使用外部资源、import、fetch、localStorage、sessionStorage 或 module script；保留完整单文件 HTML。",
                "已捕获错误：",
                errorText,
                "iframe 自检数据：",
                diagnosticText
              ].join("\n")
            }
          });

          const updated = {
            ...currentPreview,
            html: data.html,
            version: Number(currentPreview.version || 1) + 1,
            updatedAt: new Date().toISOString()
          };
          await putGame(updated);
          await refreshGames();
          openPreview(updated);
          showMessage(`已尝试修复：${updated.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      function openPreviewWindow() {
        if (!currentPreview) return;
        const win = window.open("", "_blank");
        if (!win) {
          showPreviewNotice("浏览器拦截了新窗口。请允许弹窗，或使用“下载”后直接打开 index.html。");
          return;
        }
        win.document.open();
        win.document.write(currentPreview.html);
        win.document.close();
      }

      function openSource() {
        if (!currentPreview) return;
        els.sourceText.value = currentPreview.html;
        els.sourceModal.classList.remove("hidden");
        setTimeout(() => els.sourceText.focus(), 0);
      }

      function closeSource() {
        els.sourceModal.classList.add("hidden");
        els.sourceText.value = "";
      }

      function instrumentPreviewHtml(html) {
        const script = `<script>
(function(){
  var probeCount = 0;
  function send(type, message, source, lineno, colno) {
    try {
      parent.postMessage({
        source: "game-preview",
        type: type,
        message: String(message || ""),
        location: [source || "", lineno || 0, colno || 0].join(":")
      }, "*");
    } catch (error) {}
  }
  function isNodeVisible(node) {
    var rect = node.getBoundingClientRect && node.getBoundingClientRect();
    var style = window.getComputedStyle ? window.getComputedStyle(node) : null;
    return Boolean(rect && rect.width > 1 && rect.height > 1 && (!style || style.visibility !== "hidden" && style.display !== "none" && Number(style.opacity || 1) > 0));
  }
  function isInFirstViewport(rect, ratio) {
    var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
    var viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
    var cutoff = viewportHeight * (ratio || 0.92);
    return Boolean(rect && rect.right > 0 && rect.left < viewportWidth && rect.bottom > 0 && rect.top < cutoff);
  }
  function visibleElementCount() {
    var count = 0;
    var nodes = Array.prototype.slice.call(document.body ? document.body.querySelectorAll("*") : []);
    nodes.forEach(function(node) {
      if (isNodeVisible(node)) {
        count += 1;
      }
    });
    return count;
  }
  function canvasReport() {
    var canvases = Array.prototype.slice.call(document.querySelectorAll("canvas"));
    return canvases.map(function(canvas) {
      var rect = canvas.getBoundingClientRect && canvas.getBoundingClientRect();
      var style = window.getComputedStyle ? window.getComputedStyle(canvas) : null;
      var visible = Boolean(rect && rect.width > 1 && rect.height > 1 && (!style || style.visibility !== "hidden" && style.display !== "none" && Number(style.opacity || 1) > 0));
      return { width: canvas.width || 0, height: canvas.height || 0, cssWidth: rect ? Math.round(rect.width) : 0, cssHeight: rect ? Math.round(rect.height) : 0, visible: visible, inFirstViewport: isInFirstViewport(rect) };
    });
  }
  function layoutReport(canvases) {
    var body = document.body;
    var nodes = Array.prototype.slice.call(body ? body.querySelectorAll("*") : []);
    var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
    var documentHeight = Math.max(
      body ? body.scrollHeight : 0,
      body ? body.offsetHeight : 0,
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.documentElement ? document.documentElement.offsetHeight : 0
    );
    var controls = nodes.filter(function(node) {
      var tag = node.tagName || "";
      var role = (node.getAttribute("role") || "").toLowerCase();
      return /^(button|a|input|select|textarea|summary)$/i.test(tag) || /^(button|link|slider|textbox|checkbox|radio|switch)$/i.test(role);
    }).filter(isNodeVisible);
    var controlsInFirstViewport = controls.filter(function(node) {
      return isInFirstViewport(node.getBoundingClientRect && node.getBoundingClientRect());
    });
    var contentBelowFold = controls.some(function(node) {
      var rect = node.getBoundingClientRect && node.getBoundingClientRect();
      return rect && rect.top >= viewportHeight * 0.92;
    }) || canvases.some(function(item) {
      return item.visible && !item.inFirstViewport;
    });
    function textish(value) {
      return String(value && value.baseVal ? value.baseVal : value || "");
    }
    function hasInteractiveDescendant(node) {
      return Boolean(node.querySelector && node.querySelector("button,a,input,select,textarea,summary,canvas,svg,[role='button'],[role='slider'],[role='textbox'],[role='checkbox'],[role='radio'],[role='switch']"));
    }
    var largePassivePanels = nodes.filter(function(node) {
      if (!isNodeVisible(node) || /^(html|body|main)$/i.test(node.tagName || "")) return false;
      var rect = node.getBoundingClientRect && node.getBoundingClientRect();
      var ownText = (node.innerText || "").trim();
      var descriptor = [
        textish(node.id),
        textish(node.className),
        textish(node.getAttribute("role")),
        textish(node.getAttribute("aria-label")),
        ownText.slice(0, 120)
      ].join(" ").toLowerCase();
      var looksPassive = /(result|score|status|notice|message|log|output|record|summary)/i.test(descriptor);
      var isLargeTopPanel = viewportHeight && rect && rect.top >= -4 && rect.top < viewportHeight * 0.45 && rect.height > viewportHeight * 0.35;
      return looksPassive && isLargeTopPanel && ownText.length < 220 && !hasInteractiveDescendant(node);
    });
    var scrollHeightRatio = viewportHeight ? documentHeight / viewportHeight : 1;
    var hasCanvasInFirstViewport = canvases.some(function(item) {
      return item.visible && item.inFirstViewport && item.width > 0 && item.height > 0;
    });
    var hasPrimaryInteraction = controlsInFirstViewport.length > 0 || hasCanvasInFirstViewport;
    return {
      documentHeight: documentHeight,
      scrollHeightRatio: Math.round(scrollHeightRatio * 100) / 100,
      controlsInFirstViewport: controlsInFirstViewport.length,
      hasPrimaryInteraction: hasPrimaryInteraction,
      largePassivePanelCount: largePassivePanels.length,
      needsScrollToPlay: scrollHeightRatio > 1.15 && !hasPrimaryInteraction && contentBelowFold
    };
  }
  function probe() {
    probeCount += 1;
    var body = document.body;
    var bodyText = body ? (body.innerText || "").trim() : "";
    var visible = visibleElementCount();
    var canvases = canvasReport();
    var layout = layoutReport(canvases);
    var hasVisibleCanvas = canvases.some(function(item) { return item.visible && item.width > 0 && item.height > 0; });
    var reason = "";
    var looksBlank = false;
    if (!body || body.children.length === 0) {
      looksBlank = true;
      reason = "body 没有任何子元素";
    } else if (visible === 0 && bodyText.length === 0) {
      looksBlank = true;
      reason = "没有可见元素，也没有文本";
    } else if (canvases.length > 0 && !hasVisibleCanvas && bodyText.length < 8 && probeCount >= 2) {
      looksBlank = true;
      reason = "检测到 canvas，但尺寸为 0 或不可见";
    }
    try {
      parent.postMessage({
        source: "game-preview",
        type: "probe",
        report: {
          probeCount: probeCount,
          readyState: document.readyState,
          title: document.title || "",
          bodyChildren: body ? body.children.length : 0,
          bodyTextLength: bodyText.length,
          visibleElements: visible,
          canvases: canvases,
          layout: layout,
          viewport: { width: window.innerWidth, height: window.innerHeight },
          needsScrollToPlay: layout.needsScrollToPlay,
          looksBlank: looksBlank,
          reason: reason || "未发现明显空白"
        }
      }, "*");
    } catch (error) {}
  }
  window.addEventListener("error", function(event) {
    send("error", event.message, event.filename, event.lineno, event.colno);
  });
  window.addEventListener("unhandledrejection", function(event) {
    var reason = event.reason;
    send("unhandledrejection", reason && (reason.stack || reason.message) || reason || "Unhandled promise rejection");
  });
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", probe);
  } else {
    setTimeout(probe, 0);
  }
  window.addEventListener("load", function() { setTimeout(probe, 80); });
  setTimeout(probe, 1200);
  setTimeout(probe, 3200);
})();
<\/script>`;
        if (/<head[^>]*>/i.test(html)) {
          return html.replace(/<head([^>]*)>/i, `<head$1>${script}`);
        }
        if (/<html[^>]*>/i.test(html)) {
          return html.replace(/<html([^>]*)>/i, `<html$1><head>${script}</head>`);
        }
        return script + html;
      }

      function showPreviewNotice(text, type) {
        els.previewNotice.textContent = text;
        els.previewNotice.classList.add("visible");
        els.previewNotice.classList.toggle("ok", type === "ok");
      }

      function clearPreviewNotice() {
        els.previewNotice.textContent = "";
        els.previewNotice.classList.remove("visible");
        els.previewNotice.classList.remove("ok");
      }

      function openEdit(game) {
        currentEdit = game;
        els.editTitle.textContent = `AI 修改：${game.title}`;
        els.editInstruction.value = "";
        els.editModal.classList.remove("hidden");
        setTimeout(() => els.editInstruction.focus(), 0);
      }

      function closeEdit() {
        els.editModal.classList.add("hidden");
        els.editInstruction.value = "";
        currentEdit = null;
      }

      async function renameGame(game) {
        const title = prompt("新的游戏名称", game.title);
        if (title == null) return;
        const nextTitle = title.trim();
        if (!nextTitle) return;
        const updated = { ...game, title: nextTitle.slice(0, 120), updatedAt: new Date().toISOString() };
        await putGame(updated);
        await refreshGames();
        showMessage("已重命名。", "ok");
      }

      async function deleteGame(game) {
        if (!confirm(`删除“${game.title}”？`)) return;
        await removeGame(game.id);
        if (currentPreview?.id === game.id) closePreview();
        await refreshGames();
        showMessage("已删除。", "ok");
      }

      function downloadGame(game) {
        const blob = new Blob([game.html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "index.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function requestJson(url, options = {}) {
        let response;
        try {
          response = await fetch(url, {
            method: options.method || "GET",
            headers: options.body ? { "Content-Type": "application/json" } : undefined,
            body: options.body ? JSON.stringify(options.body) : undefined
          });
        } catch (error) {
          throw new Error("后端连接中断或请求超时，请确认 node server.js 仍在运行，然后重试。");
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = data.detail ? `：${data.detail}` : "";
          throw new Error((data.error || "请求失败") + detail);
        }
        return data;
      }

      function openDb() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE)) {
              const store = db.createObjectStore(STORE, { keyPath: "id" });
              store.createIndex("updatedAt", "updatedAt");
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return dbPromise;
      }

      async function getAllGames() {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const request = tx.objectStore(STORE).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      async function putGame(game) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(game);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      async function removeGame(id) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      function setBusy(isBusy, text, estimateMs) {
        stopProgressTimer();
        els.busyText.textContent = text || "正在处理";
        els.busyLayer.classList.toggle("hidden", !isBusy);
        els.generateBtn.disabled = isBusy;
        els.submitEditBtn.disabled = isBusy;
        if (isBusy) {
          startProgressTimer(estimateMs || 180000);
        } else {
          els.progressFill.style.width = "100%";
          els.progressPercent.textContent = "100%";
          els.progressEta.textContent = "已完成";
        }
      }

      function startProgressTimer(estimateMs) {
        progressStartedAt = Date.now();
        progressEstimateMs = Math.max(estimateMs, 3000);
        updateProgress();
        progressTimer = window.setInterval(updateProgress, 1000);
      }

      function stopProgressTimer() {
        if (progressTimer) {
          window.clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function updateProgress() {
        const elapsed = Date.now() - progressStartedAt;
        const ratio = elapsed / progressEstimateMs;
        const eased = 1 - Math.pow(1 - Math.min(ratio, 1), 2.4);
        const percent = ratio <= 1 ? Math.min(92, Math.max(3, Math.round(eased * 92))) : 92;
        const remaining = Math.max(0, progressEstimateMs - elapsed);

        els.progressFill.style.width = `${percent}%`;
        els.progressPercent.textContent = `${percent}%`;
        els.progressEta.textContent = remaining > 0
          ? `预计剩余 ${formatDuration(remaining)}`
          : `已超出预计 ${formatDuration(elapsed - progressEstimateMs)}，继续等待`;
      }

      function showMessage(text, type) {
        els.message.textContent = text;
        els.message.classList.toggle("error", type === "error");
        els.message.classList.toggle("ok", type === "ok");
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `game-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function formatDate(value) {
        const date = value ? new Date(value) : new Date();
        if (Number.isNaN(date.getTime())) return "未知时间";
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function formatBytes(chars) {
        const bytes = new Blob(["x".repeat(chars)]).size;
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function formatDuration(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        if (minutes <= 0) return `${seconds}s`;
        return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
      }
    })();
  </script>
</body>
</html>
