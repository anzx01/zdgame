<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 小游戏工坊</title>
  <style>
    :root {
      --ink: #080808;
      --paper: #fff8e8;
      --cream: #ffe86b;
      --red: #ff4f3f;
      --green: #00c875;
      --cyan: #00c2ff;
      --yellow: #ffe500;
      --blue: #3157ff;
      --pink: #ff6bd6;
      --line: #080808;
      --muted: #383838;
      --panel: #fff8e8;
      --shadow: #080808;
      --radius: 4px;
      --hard-shadow: 10px 10px 0 var(--line);
      --soft-shadow: 0 18px 48px rgba(83, 70, 45, 0.18);
    }

    [data-theme="storybook"] {
      --ink: #2e3328;
      --paper: #fff8df;
      --cream: #f7e9b6;
      --red: #d86b4c;
      --green: #78ad6f;
      --cyan: #9ac9c1;
      --yellow: #f4c96b;
      --blue: #5f82a5;
      --pink: #e7a6a8;
      --line: #5a4b36;
      --muted: #75694f;
      --panel: rgba(255, 248, 223, 0.92);
      --shadow: rgba(83, 70, 45, 0.2);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(8, 8, 8, 0.12) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(0deg, rgba(8, 8, 8, 0.12) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(135deg, #ffe500 0 28%, #00c2ff 28% 54%, #ff6bd6 54% 77%, #fff8e8 77%);
      font-family: Impact, Haettenschweiler, "Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif;
      transition: background 260ms ease, color 260ms ease;
    }

    [data-theme="storybook"] body {
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.8) 0 7%, transparent 7.5%),
        radial-gradient(circle at 82% 18%, rgba(255, 244, 201, 0.9) 0 9%, transparent 9.5%),
        linear-gradient(160deg, rgba(120, 173, 111, 0.35), transparent 36%),
        linear-gradient(20deg, rgba(154, 201, 193, 0.55), transparent 42%),
        #f6dfa9;
      font-family: "Trebuchet MS", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    body {
      padding: 12px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 4px solid var(--line);
      background: var(--yellow);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
      padding: 11px 15px;
      box-shadow: 6px 6px 0 var(--line);
      border-radius: var(--radius);
      text-transform: uppercase;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:hover {
      background: #ffe377;
    }

    button:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 var(--line);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover {
      background: #ff725f;
    }

    .btn-green {
      background: var(--green);
      color: var(--ink);
    }

    .btn-blue {
      background: var(--cyan);
      color: #fff;
    }

    .btn-danger {
      background: var(--ink);
      color: #fff;
    }

    .btn-ghost {
      background: #fff;
      color: var(--ink);
    }

    .app {
      width: 100%;
      margin: 0;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }

    .topline {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      background: var(--paper);
      padding-bottom: 4px;
    }

    .top-controls {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .theme-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      border: 3px solid var(--line);
      background: #fff;
      box-shadow: 4px 4px 0 var(--line);
      padding: 5px;
      border-radius: var(--radius);
    }

    .theme-switch button {
      box-shadow: none;
      border-width: 2px;
      padding: 7px 18px;
      background: #fff;
      font-size: 13px;
    }

    .theme-switch button.active {
      background: var(--yellow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
      border: 3px solid var(--line);
      background: var(--paper);
      box-shadow: 5px 5px 0 var(--line);
      padding: 8px 12px;
      transform: none;
    }

    .brand > div {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
      white-space: nowrap;
    }

    [data-theme="storybook"] .brand {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.78), rgba(255, 248, 223, 0.96)),
        var(--panel);
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: rotate(-0.25deg);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 3px solid var(--line);
      background:
        linear-gradient(90deg, transparent 0 24px, rgba(8, 8, 8, 0.22) 24px 29px, transparent 29px),
        linear-gradient(0deg, var(--red) 0 50%, var(--yellow) 50%);
      box-shadow: 4px 4px 0 var(--line);
      border-radius: var(--radius);
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .brand-mark::before {
      width: 10px;
      height: 5px;
      left: 6px;
      top: 7px;
      box-shadow: 13px 0 0 var(--ink), 7px 14px 0 var(--ink);
    }

    .brand-mark::after {
      width: 6px;
      height: 6px;
      right: 5px;
      bottom: 5px;
      background: var(--cyan);
      border: 2px solid var(--ink);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3.8vw, 48px);
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 3px 3px 0 var(--yellow), 5px 5px 0 var(--pink);
    }

    [data-theme="storybook"] h1 {
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.65);
    }

    .subtitle {
      margin: 0 0 0 12px;
      color: var(--ink);
      font-weight: 900;
      font-size: clamp(12px, 1.2vw, 15px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .status-pill {
      justify-self: end;
      align-self: center;
      border: 5px solid var(--line);
      background: var(--green);
      box-shadow: 8px 8px 0 var(--line);
      padding: 14px 16px;
      border-radius: var(--radius);
      font-weight: 900;
      white-space: nowrap;
      transform: rotate(1deg);
    }

    [data-theme="storybook"] .status-pill,
    [data-theme="storybook"] .theme-switch {
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: none;
    }

    .status-pill.ready {
      background: var(--green);
    }

    .status-pill.warn {
      background: var(--red);
      color: #fff;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 0 0 18px;
    }

    .intro-card {
      border: 5px solid var(--line);
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 8px 8px 0 var(--line);
      min-height: 152px;
      position: relative;
      overflow: hidden;
      transform: rotate(0.35deg);
    }

    [data-theme="storybook"] .intro-card,
    [data-theme="storybook"] .surface,
    [data-theme="storybook"] .game-row,
    [data-theme="storybook"] .dialog,
    [data-theme="storybook"] .preview-shell,
    [data-theme="storybook"] .busy-box {
      border-width: 3px;
      box-shadow: var(--soft-shadow);
      transform: none;
    }

    .intro-card:nth-child(1) {
      background: var(--yellow);
      transform: rotate(-0.8deg);
    }

    .intro-card:nth-child(2) {
      background: var(--cyan);
    }

    .intro-card:nth-child(3) {
      background: var(--pink);
      transform: rotate(0.8deg);
    }

    .intro-card strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .intro-card span {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 900;
    }

    .mini-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .mini-list span {
      border: 2px solid var(--line);
      background: rgba(255, 255, 255, 0.64);
      border-radius: var(--radius);
      padding: 5px 7px;
      font-size: 13px;
      line-height: 1.2;
    }

    .mega-number {
      display: block;
      margin: 2px 0 4px;
      font-size: clamp(64px, 12vw, 132px);
      line-height: 0.82;
      letter-spacing: 0;
      color: var(--ink);
      text-shadow: 5px 5px 0 #fff, 9px 9px 0 var(--red);
    }

    .stamp {
      position: absolute;
      right: -14px;
      top: 14px;
      border: 4px solid var(--line);
      background: var(--red);
      color: #fff;
      padding: 7px 13px;
      font-size: 14px;
      font-weight: 900;
      transform: rotate(12deg);
      box-shadow: 5px 5px 0 var(--line);
    }

    [data-theme="storybook"] .stamp {
      border-width: 2px;
      box-shadow: 0 6px 18px rgba(83, 70, 45, 0.2);
      border-radius: 999px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 380px) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
    }

    .surface {
      border: 5px solid var(--line);
      background: var(--panel);
      box-shadow: 10px 10px 0 var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .surface:nth-child(1) {
      position: sticky;
      top: 76px;
      z-index: 8;
      transform: none;
      align-self: start;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
    }

    .surface:nth-child(2) {
      transform: none;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .surface-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: var(--ink);
      color: #fff;
      border-bottom: 5px solid var(--line);
    }

    .surface-head h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .surface-body {
      padding: 16px;
    }

    .library-body {
      padding: 0;
      flex: 1 1 auto;
      min-height: 0;
    }

    .library-scroll {
      height: 100%;
      max-height: none;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--red) rgba(255, 255, 255, 0.7);
    }

    .library-scroll::-webkit-scrollbar {
      width: 12px;
    }

    .library-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.7);
      border-left: 3px solid var(--line);
    }

    .library-scroll::-webkit-scrollbar-thumb {
      background: var(--red);
      border: 3px solid var(--line);
      border-radius: 999px;
    }

    [data-theme="storybook"] .library-scroll {
      max-height: none;
      scrollbar-color: var(--green) rgba(255, 248, 223, 0.78);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      border: 4px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      outline: none;
      padding: 12px 13px;
      font-weight: 900;
      box-shadow: 5px 5px 0 rgba(8, 8, 8, 0.18);
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
      box-shadow: 5px 5px 0 var(--line), 0 0 0 5px var(--yellow);
    }

    .example-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 16px;
    }

    .chip {
      padding: 7px 10px;
      border: 3px solid var(--line);
      background: var(--cream);
      border-radius: var(--radius);
      box-shadow: 4px 4px 0 var(--line);
      font-size: 13px;
      font-weight: 900;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .message {
      min-height: 45px;
      margin-top: 14px;
      border: 4px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 10px 12px;
      font-weight: 900;
      color: var(--ink);
      box-shadow: 5px 5px 0 rgba(8, 8, 8, 0.18);
    }

    .message.error {
      background: #ffe0dc;
      color: #7a2018;
    }

    .message.ok {
      background: #dcffe4;
      color: #155c33;
    }

    .library-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(360px, 100%);
    }

    .library-count {
      flex: 0 0 auto;
      border: 3px solid var(--line);
      background: var(--yellow);
      padding: 7px 9px;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 4px 4px 0 var(--line);
      border-radius: var(--radius);
    }

    .library-tools input {
      padding: 9px 11px;
      border-width: 2px;
      box-shadow: none;
      font-size: 14px;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .game-row {
      position: relative;
      border: 3px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 0;
      min-height: 0;
      aspect-ratio: 16 / 10;
      box-shadow: 3px 3px 0 var(--line);
      cursor: pointer;
      overflow: hidden;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .game-row:hover,
    .game-row:focus-visible {
      background: #fffdf1;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--line);
    }

    .game-thumb {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(135deg, var(--thumb-a, #ffe500), var(--thumb-b, #00c2ff) 58%, var(--thumb-c, #ff6bd6));
      overflow: hidden;
      isolation: isolate;
    }

    .game-thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px) 0 0 / 18px 18px,
        linear-gradient(0deg, rgba(8, 8, 8, 0.14) 1px, transparent 1px) 0 0 / 18px 18px;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .game-thumb::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: 2;
      height: 58%;
      background: linear-gradient(0deg, rgba(8, 8, 8, 0.86), rgba(8, 8, 8, 0.42) 56%, transparent);
      pointer-events: none;
    }

    .game-thumb img {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .thumb-fallback {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        linear-gradient(115deg, transparent 0 36%, rgba(255, 255, 255, 0.32) 46%, transparent 58%) -160% 0 / 220% 100%,
        linear-gradient(135deg, var(--thumb-a, #ffe500), var(--thumb-b, #00c2ff) 58%, var(--thumb-c, #ff6bd6));
      animation: thumb-sweep 1.4s ease-in-out infinite;
    }

    @keyframes thumb-sweep {
      to {
        background-position: 160% 0, 0 0;
      }
    }

    .card-delete {
      position: absolute;
      right: 7px;
      top: 7px;
      z-index: 4;
      border-width: 2px;
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 16px;
      line-height: 1;
      box-shadow: 0 3px 0 var(--line);
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .game-row:hover .card-delete,
    .game-row:focus-within .card-delete {
      opacity: 1;
      transform: translateY(0);
    }

    [data-theme="storybook"] button,
    [data-theme="storybook"] input,
    [data-theme="storybook"] textarea,
    [data-theme="storybook"] .message,
    [data-theme="storybook"] .chip,
    [data-theme="storybook"] .library-count {
      border-width: 2px;
      box-shadow: 0 8px 20px rgba(83, 70, 45, 0.14);
    }

    [data-theme="storybook"] button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 14px rgba(83, 70, 45, 0.16);
    }

    .game-thumb h3 {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      z-index: 3;
      margin: 0;
      color: #fff;
      font-size: 12px;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 0 rgba(8, 8, 8, 0.82);
      white-space: nowrap;
    }

    .empty-state {
      border: 4px dashed var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 28px;
      text-align: center;
      font-weight: 900;
      color: #554b38;
    }

    .hidden {
      display: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8, 8, 8, 0.76);
      padding: 12px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .preview-shell {
      width: min(1240px, calc(100vw - 24px));
      height: min(820px, calc(100dvh - 24px));
      display: flex;
      flex-direction: column;
      border: 5px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 12px 12px 0 var(--line);
      overflow: hidden;
    }

    .preview-bar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--ink);
      color: #fff;
      border-bottom: 5px solid var(--line);
    }

    .preview-title {
      min-width: 0;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .preview-actions button {
      padding: 8px 10px;
      border-width: 2px;
      box-shadow: 0 3px 0 var(--line);
      font-size: 13px;
    }

    .preview-notice {
      flex: 0 0 auto;
      display: none;
      border-bottom: 3px solid var(--line);
      background: #ffe0dc;
      color: #7a2018;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 900;
      overflow-wrap: anywhere;
      max-height: min(96px, 18vh);
      overflow-y: auto;
    }

    .preview-notice.visible {
      display: block;
    }

    .preview-notice.ok {
      background: #dcffe4;
      color: #155c33;
    }

    .preview-shell iframe {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      overflow: hidden;
      overscroll-behavior: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
      overflow: hidden;
    }

    .dialog {
      width: min(560px, 100%);
      border: 5px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: 10px 10px 0 var(--line);
      overflow: hidden;
    }

    .dialog-head {
      background: var(--ink);
      color: #fff;
      padding: 13px 15px;
      border-bottom: 4px solid var(--line);
      font-weight: 900;
    }

    .dialog-body {
      padding: 16px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .source-view {
      width: 100%;
      min-height: min(58vh, 520px);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      white-space: pre;
    }

    .busy-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: rgba(255, 229, 0, 0.52);
      backdrop-filter: blur(2px);
    }

    .busy-box {
      min-width: min(420px, calc(100vw - 36px));
      border: 5px solid var(--line);
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 10px 10px 0 var(--line);
      font-weight: 900;
    }

    .busy-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .progress-track {
      height: 18px;
      border: 3px solid #fff9df;
      background: rgba(255, 249, 223, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--green), var(--cyan));
      transition: width 360ms ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: #fff4cf;
      font-size: 13px;
    }

    @media (max-width: 1200px) {
      .game-list {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .topline,
      .intro-grid,
      .workspace {
        grid-template-columns: 1fr;
      }

      .topline {
        flex-wrap: wrap;
      }

      .brand > div {
        flex-wrap: wrap;
        white-space: normal;
      }

      .brand {
        align-items: flex-start;
        transform: none;
      }

      h1 {
        font-size: clamp(32px, 13vw, 56px);
      }

      .top-controls {
        margin-left: 0;
      }

      .library-scroll {
        height: auto;
        max-height: none;
      }

      .intro-card,
      .surface {
        transform: none !important;
      }

      .mega-number {
        font-size: clamp(72px, 24vw, 116px);
      }

      .game-row {
        grid-template-columns: 1fr;
      }

      .game-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .preview-bar {
        grid-template-columns: 1fr;
      }

      .preview-actions {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>AI 小游戏工坊</h1>
          <p class="subtitle">VIRAL GAME MACHINE · 一句话爆点、打开即玩、结果可晒的 HTML 小游戏</p>
        </div>
      </div>
      <div class="top-controls">
        <div class="theme-switch" aria-label="界面风格切换">
          <button id="neoThemeBtn" type="button" data-theme-choice="neo">NEO</button>
          <button id="storyThemeBtn" type="button" data-theme-choice="storybook">童话</button>
        </div>
      </div>
    </header>

    <section class="workspace">
      <section class="surface" aria-label="生成游戏">
        <div class="surface-head">
          <h2>生成新游戏</h2>
        </div>
        <div class="surface-body">
          <form id="generateForm">
            <div class="field">
              <label for="gameName">游戏名称</label>
              <input id="gameName" name="gameName" autocomplete="off" maxlength="80" placeholder="例如：画一个完美圆" required>
            </div>

            <div class="example-grid" aria-label="快速示例">
              <button class="chip" type="button" data-example="画一个完美圆" data-extra="用户拖动鼠标或手指画圆，结束后给出百分制圆度、称号、结果卡和分享文案。">完美圆</button>
              <button class="chip" type="button" data-example="密码规则地狱" data-extra="输入密码，规则逐步变得离谱但可理解；展示当前规则、失败原因、最高通过规则数和吐槽式分享文案。">密码地狱</button>
              <button class="chip" type="button" data-example="真假 Logo 挑战" data-extra="每轮展示两个极简品牌标记，让玩家判断哪个更像真 Logo；10 题结算正确率和称号。">真假判断</button>
              <button class="chip" type="button" data-example="无限词语组合实验" data-extra="从四个基础词开始，两两组合生成新词；结果要离谱、有收藏列表、发现数量和分享文案。">组合实验</button>
              <button class="chip" type="button" data-example="颜色记忆挑战" data-extra="先看 2 秒目标颜色，再用滑块还原；按色差给分、称号、结果卡和再挑战按钮。">颜色记忆</button>
            </div>

            <div class="field">
              <label for="extraRequirements">爆款补充</label>
              <textarea id="extraRequirements" name="extraRequirements" maxlength="1200" placeholder="例如：结果越离谱越好、要有称号、适合截图、30 秒一局、手机也好玩"></textarea>
            </div>

            <div class="action-row">
              <button id="generateBtn" class="btn-primary" type="submit">生成并试玩</button>
              <button id="importSampleBtn" class="btn-ghost" type="button">导入炸弹人示例</button>
            </div>
          </form>
          <div id="message" class="message">准备就绪。输入一个能一句话讲清楚的挑战。</div>
        </div>
      </section>

      <section class="surface" aria-label="游戏库">
        <div class="surface-head">
          <h2>游戏库</h2>
          <div class="library-tools">
            <span id="libraryCount" class="library-count">0 个</span>
            <input id="searchInput" type="search" placeholder="搜索游戏">
          </div>
        </div>
        <div class="surface-body library-body">
          <div class="library-scroll">
            <div id="emptyState" class="empty-state hidden">还没有游戏。</div>
            <div id="gameList" class="game-list"></div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="previewModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="试玩窗口">
    <div class="preview-shell">
      <div class="preview-bar">
        <div id="previewTitle" class="preview-title">试玩</div>
        <div class="preview-actions">
          <button id="reloadPreviewBtn" class="btn-blue" type="button">重新加载</button>
          <button id="repairPreviewBtn" class="btn-primary" type="button">修复显示</button>
          <button id="copyShareBtn" class="btn-green" type="button">复制分享</button>
          <button id="openWindowBtn" class="btn-ghost" type="button">新窗口</button>
          <button id="viewSourceBtn" class="btn-ghost" type="button">源码</button>
          <button id="downloadPreviewBtn" class="btn-green" type="button">下载</button>
          <button id="closePreviewBtn" class="btn-ghost" type="button">关闭</button>
        </div>
      </div>
      <div id="previewNotice" class="preview-notice"></div>
      <iframe id="gamePreview" title="游戏试玩" referrerpolicy="no-referrer" scrolling="no"></iframe>
    </div>
  </div>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="AI 修改游戏">
    <form id="editForm" class="dialog">
      <div id="editTitle" class="dialog-head">AI 修改</div>
      <div class="dialog-body">
        <div class="field">
          <label for="editInstruction">修改要求</label>
          <textarea id="editInstruction" maxlength="1200" placeholder="例如：增加计时器和下一关，失败后显示最终分数" required></textarea>
        </div>
        <div class="dialog-actions">
          <button id="cancelEditBtn" class="btn-ghost" type="button">取消</button>
          <button id="submitEditBtn" class="btn-primary" type="submit">提交修改</button>
        </div>
      </div>
    </form>
  </div>

  <div id="sourceModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="查看源码">
    <div class="dialog" style="width:min(980px,100%);">
      <div class="dialog-head">当前游戏源码</div>
      <div class="dialog-body">
        <textarea id="sourceText" class="source-view" readonly></textarea>
        <div class="dialog-actions">
          <button id="closeSourceBtn" class="btn-ghost" type="button">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div id="busyLayer" class="busy-layer hidden">
    <div class="busy-box">
      <div id="busyText" class="busy-title">正在生成</div>
      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressPercent">0%</span>
        <span id="progressEta">预计剩余 --</span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const DB_NAME = "ai-mini-game-workshop";
      const DB_VERSION = 1;
      const STORE = "games";
      const SAMPLE_ID = "sample-bomberman";
      const THEME_KEY = "ai-mini-game-workshop-theme";

      const els = {
        neoThemeBtn: document.getElementById("neoThemeBtn"),
        storyThemeBtn: document.getElementById("storyThemeBtn"),
        libraryCount: document.getElementById("libraryCount"),
        generateForm: document.getElementById("generateForm"),
        gameName: document.getElementById("gameName"),
        extraRequirements: document.getElementById("extraRequirements"),
        generateBtn: document.getElementById("generateBtn"),
        importSampleBtn: document.getElementById("importSampleBtn"),
        message: document.getElementById("message"),
        searchInput: document.getElementById("searchInput"),
        emptyState: document.getElementById("emptyState"),
        gameList: document.getElementById("gameList"),
        previewModal: document.getElementById("previewModal"),
        previewTitle: document.getElementById("previewTitle"),
        previewNotice: document.getElementById("previewNotice"),
        gamePreview: document.getElementById("gamePreview"),
        reloadPreviewBtn: document.getElementById("reloadPreviewBtn"),
        repairPreviewBtn: document.getElementById("repairPreviewBtn"),
        copyShareBtn: document.getElementById("copyShareBtn"),
        openWindowBtn: document.getElementById("openWindowBtn"),
        viewSourceBtn: document.getElementById("viewSourceBtn"),
        downloadPreviewBtn: document.getElementById("downloadPreviewBtn"),
        closePreviewBtn: document.getElementById("closePreviewBtn"),
        editModal: document.getElementById("editModal"),
        editForm: document.getElementById("editForm"),
        editTitle: document.getElementById("editTitle"),
        editInstruction: document.getElementById("editInstruction"),
        cancelEditBtn: document.getElementById("cancelEditBtn"),
        submitEditBtn: document.getElementById("submitEditBtn"),
        sourceModal: document.getElementById("sourceModal"),
        sourceText: document.getElementById("sourceText"),
        closeSourceBtn: document.getElementById("closeSourceBtn"),
        busyLayer: document.getElementById("busyLayer"),
        busyText: document.getElementById("busyText"),
        progressFill: document.getElementById("progressFill"),
        progressPercent: document.getElementById("progressPercent"),
        progressEta: document.getElementById("progressEta")
      };

      let dbPromise = null;
      let games = [];
      let currentPreview = null;
      let currentPreviewUrl = "";
      let currentEdit = null;
      let currentPreviewErrors = [];
      let currentPreviewDiagnostics = [];
      let progressTimer = null;
      let progressStartedAt = 0;
      let progressEstimateMs = 180000;
      let thumbnailCaptureQueue = [];
      let thumbnailCaptureRunning = false;
      const thumbnailCaptureAttempted = new Set();
      const THUMBNAIL_CAPTURE_CONCURRENCY = 3;

      init();

      function init() {
        applyTheme(localStorage.getItem(THEME_KEY) || "neo");
        wireEvents();
        loadHealth();
        refreshGames();
      }

      function wireEvents() {
        els.generateForm.addEventListener("submit", onGenerate);
        els.neoThemeBtn.addEventListener("click", () => setTheme("neo"));
        els.storyThemeBtn.addEventListener("click", () => setTheme("storybook"));
        els.importSampleBtn.addEventListener("click", importSample);
        els.searchInput.addEventListener("input", renderGames);
        els.reloadPreviewBtn.addEventListener("click", reloadPreview);
        els.repairPreviewBtn.addEventListener("click", repairPreview);
        els.copyShareBtn.addEventListener("click", copyCurrentShareText);
        els.openWindowBtn.addEventListener("click", openPreviewWindow);
        els.viewSourceBtn.addEventListener("click", openSource);
        els.downloadPreviewBtn.addEventListener("click", () => currentPreview && downloadGame(currentPreview));
        els.closePreviewBtn.addEventListener("click", closePreview);
        els.cancelEditBtn.addEventListener("click", closeEdit);
        els.editForm.addEventListener("submit", submitEdit);
        els.closeSourceBtn.addEventListener("click", closeSource);

        document.querySelectorAll("[data-example]").forEach((button) => {
          button.addEventListener("click", () => {
            els.gameName.value = button.dataset.example;
            if (button.dataset.extra) {
              els.extraRequirements.value = button.dataset.extra;
            }
            els.gameName.focus();
          });
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            if (!els.sourceModal.classList.contains("hidden")) closeSource();
            else if (!els.editModal.classList.contains("hidden")) closeEdit();
            else if (!els.previewModal.classList.contains("hidden")) closePreview();
          }
        });

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || !currentPreview) return;
          if (data.source === "ai-game-workshop" && data.type === "result") {
            savePreviewResult(data).catch((error) => showPreviewNotice(`结果保存失败：${error.message}`));
            return;
          }
          if (data.source !== "game-preview") return;
          if (data.type === "error" || data.type === "unhandledrejection") {
            const message = String(data.message || "未知脚本错误");
            currentPreviewErrors.push(message);
            currentPreviewErrors = currentPreviewErrors.slice(-6);
            showPreviewNotice(`游戏脚本报错：${message}。可以点击“修复显示”。`);
          } else if (data.type === "probe") {
            currentPreviewDiagnostics.push(JSON.stringify(data.report));
            currentPreviewDiagnostics = currentPreviewDiagnostics.slice(-8);
            if (data.report && data.report.looksBlank) {
              showPreviewNotice(`试玩已加载，但检测到画面可能为空白：${data.report.reason}。可以点“新窗口”判断是否为 iframe 问题，或点“修复显示”。`);
            } else if (data.report && data.report.hasImmediateGameOver) {
              showPreviewNotice("试玩已加载，但游戏在有效操作前就进入失败/结算状态。可以点击“修复显示”。");
            } else if (data.report && data.report.needsScrollToPlay) {
              showPreviewNotice("试玩已加载，但首屏没有可操作的游戏画面，主要内容可能被空白结果区推到下方。可以点击“修复显示”。");
            } else if (data.report && data.report.layout && data.report.layout.largePassivePanelCount > 0) {
              showPreviewNotice("试玩已加载，但首屏结果/状态区域过高，游戏控件不够靠前。可以点击“修复显示”。");
            }
          }
        });
      }

      function setTheme(theme) {
        applyTheme(theme);
        localStorage.setItem(THEME_KEY, theme);
      }

      function applyTheme(theme) {
        const safeTheme = theme === "storybook" ? "storybook" : "neo";
        document.documentElement.dataset.theme = safeTheme;
        els.neoThemeBtn.classList.toggle("active", safeTheme === "neo");
        els.storyThemeBtn.classList.toggle("active", safeTheme === "storybook");
      }

      function isRuleHeavyGame(text) {
        const value = String(text || "").toLowerCase();
        return [
          "象棋", "中国象棋", "xiangqi", "chinese chess",
          "国际象棋", "chess", "围棋", "go game", "五子棋", "gomoku",
          "黑白棋", "reversi", "othello", "跳棋", "checkers",
          "四子棋", "connect four", "数独", "sudoku", "麻将", "mahjong",
          "军棋", "斗兽棋", "扑克牌", "纸牌", "poker", "card game", "solitaire"
        ].some((keyword) => value.includes(keyword.toLowerCase()));
      }

      async function loadHealth() {
        try {
          const health = await requestJson("/api/health");
          if (!health.hasKey) {
            showMessage("请先在终端设置 DeepSeek API Key，再生成新游戏。", "error");
          }
        } catch (error) {
          showMessage(error.message, "error");
        }
      }

      async function onGenerate(event) {
        event.preventDefault();
        const gameName = els.gameName.value.trim();
        const extraRequirements = els.extraRequirements.value.trim();
        if (!gameName) return;

        const ruleHeavy = isRuleHeavyGame(`${gameName}\n${extraRequirements}`);
        setBusy(true, ruleHeavy ? "DeepSeek Think 正在生成规则游戏" : "DeepSeek 正在生成游戏", ruleHeavy ? 900000 : 300000);
        showMessage(ruleHeavy ? "后台正在生成、试玩、检查规则并自动修复。" : "后台正在生成、试玩并自动修复明显问题。", "");
        try {
          const data = await requestJson("/api/generate", {
            method: "POST",
            body: { gameName, extraRequirements }
          });

          const now = new Date().toISOString();
          const viralMeta = buildViralMeta(gameName, extraRequirements, data);
          const game = {
            id: createId(),
            title: gameName,
            gameName,
            html: data.html,
            createdAt: now,
            updatedAt: now,
            version: 1,
            ...viralMeta
          };
          await putGame(game);
          await refreshGames();
          openPreview(game);
          showMessage(data.repaired ? `已生成：${game.title}（已后台修复）` : `已生成：${game.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function submitEdit(event) {
        event.preventDefault();
        if (!currentEdit) return;
        const instruction = els.editInstruction.value.trim();
        if (!instruction) return;

        const ruleHeavy = isRuleHeavyGame(`${currentEdit.title}\n${instruction}`);
        setBusy(true, ruleHeavy ? "DeepSeek Think 正在修改规则游戏" : "DeepSeek 正在修改游戏", ruleHeavy ? 900000 : 300000);
        try {
          const data = await requestJson("/api/modify", {
            method: "POST",
            body: {
              title: currentEdit.title,
              html: currentEdit.html,
              instruction
            }
          });

          const updated = {
            ...currentEdit,
            html: data.html,
            version: Number(currentEdit.version || 1) + 1,
            updatedAt: new Date().toISOString(),
            ...buildViralMeta(currentEdit.title, instruction, data, currentEdit),
            thumbnail: ""
          };
          await putGame(updated);
          closeEdit();
          await refreshGames();
          openPreview(updated);
          showMessage(data.repaired ? `已修改：${updated.title}（已后台修复）` : `已修改：${updated.title}`, "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function importSample() {
        setBusy(true, "正在导入示例", 3500);
        try {
          const response = await fetch("/samples/bomberman.html", { cache: "no-store" });
          if (!response.ok) throw new Error("无法读取炸弹人示例。");
          const html = await response.text();
          const existing = games.find((game) => game.id === SAMPLE_ID);
          const now = new Date().toISOString();
          const sample = {
            id: SAMPLE_ID,
            title: "炸弹人示例",
            gameName: "Bomberman / 炸弹人",
            html,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
            version: existing ? Number(existing.version || 1) + 1 : 1,
            ...buildViralMeta("炸弹人示例", "经典炸弹人挑战，清空敌人并晒出通关结果。", {}, existing)
          };
          await putGame(sample);
          await refreshGames();
          openPreview(sample);
          showMessage("炸弹人示例已导入。", "ok");
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          setBusy(false);
        }
      }

      async function refreshGames() {
        games = await getAllGames();
        await migrateLegacyThumbnails();
        games.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
        renderGames();
      }

      async function migrateLegacyThumbnails() {
        const legacy = games.filter((game) => isLegacyThumbnail(game.thumbnail));
        if (!legacy.length) return;
        for (const game of legacy) {
          game.thumbnail = "";
          await putGame(game);
        }
      }

      function renderGames() {
        const query = els.searchInput.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.gameName} ${game.hook || ""} ${(game.viralTags || []).join(" ")}`.toLowerCase();
          return !query || haystack.includes(query);
        });

        els.libraryCount.textContent = query
          ? `${filtered.length}/${games.length}`
          : `${games.length} 个`;
        els.gameList.textContent = "";
        els.emptyState.classList.toggle("hidden", filtered.length > 0);
        for (const game of filtered) {
          els.gameList.appendChild(createGameRow(game));
        }
        scheduleMissingThumbnails(filtered);
      }

      function createGameRow(game) {
        const row = document.createElement("article");
        row.className = "game-row";
        row.dataset.gameId = game.id;
        row.tabIndex = 0;
        row.addEventListener("click", () => openPreview(game));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPreview(game);
          }
        });

        const thumb = createGameThumb(game);
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "card-delete btn-danger";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `删除 ${game.title}`);
        deleteButton.title = "删除";
        deleteButton.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteGame(game);
        });
        const title = document.createElement("h3");
        title.textContent = game.title;
        thumb.appendChild(title);

        row.append(deleteButton, thumb);
        return row;
      }

      function createGameThumb(game) {
        const thumb = document.createElement("div");
        thumb.className = "game-thumb";
        const colors = getThumbColors(game);
        thumb.style.setProperty("--thumb-a", colors[0]);
        thumb.style.setProperty("--thumb-b", colors[1]);
        thumb.style.setProperty("--thumb-c", colors[2]);

        const thumbnail = getRealThumbnail(game);
        if (thumbnail) {
          const img = document.createElement("img");
          img.alt = `${game.title} 预览图`;
          img.loading = "lazy";
          img.src = thumbnail;
          thumb.appendChild(img);
        } else {
          thumb.classList.add("is-missing-thumb");
          const fallback = document.createElement("div");
          fallback.className = "thumb-fallback";
          fallback.setAttribute("aria-hidden", "true");
          thumb.appendChild(fallback);
        }

        return thumb;
      }

      function getThumbColors(game) {
        const palettes = [
          ["#ff4f3f", "#ffe500", "#00c2ff"],
          ["#3157ff", "#00c875", "#ffe86b"],
          ["#ff6bd6", "#ff4f3f", "#fff8e8"],
          ["#00c2ff", "#3157ff", "#ff6bd6"],
          ["#78ad6f", "#f4c96b", "#e7a6a8"]
        ];
        const key = String(game.title || game.gameName || game.id || "");
        let hash = 0;
        for (let index = 0; index < key.length; index += 1) {
          hash = (hash * 31 + key.charCodeAt(index)) >>> 0;
        }
        return palettes[hash % palettes.length];
      }

      function getRealThumbnail(value) {
        const thumbnail = typeof value === "string" ? value : value?.thumbnail;
        if (!thumbnail || isLegacyThumbnail(thumbnail)) return "";
        return thumbnail;
      }

      function isLegacyThumbnail(thumbnail) {
        return /^data:image\/svg\+xml/i.test(String(thumbnail || ""));
      }

      function buildViralMeta(title, extraText, data = {}, existing = {}) {
        const hook = normalizeInlineText(data.hook || existing.hook || inferHook(title, extraText), 120);
        const viralTags = normalizeTags(data.viralTags || data.tags || existing.viralTags || inferTags(title, extraText));
        const defaultShareText = normalizeInlineText(
          data.defaultShareText ||
          existing.defaultShareText ||
          `我刚生成了「${title}」：${hook}。来试试你能拿到什么结果。`,
          220
        );
        return {
          hook,
          viralTags,
          defaultShareText,
          lastResult: existing.lastResult || null,
          thumbnail: getRealThumbnail(data) || getRealThumbnail(existing)
        };
      }

      function inferHook(title, extraText) {
        const text = `${title || ""} ${extraText || ""}`.toLowerCase();
        if (/圆|circle/.test(text)) return "画一个尽可能完美的圆，看系统给你多少分。";
        if (/密码|password/.test(text)) return "写一个满足越来越离谱规则的密码，看看你能撑到第几条。";
        if (/真假|logo|fake|ai or not|判断/.test(text)) return "在真假之间快速下注，最后晒出你的判断力。";
        if (/颜色|color/.test(text)) return "看一眼颜色，再凭记忆把它还原出来。";
        if (/组合|craft|合成|词/.test(text)) return "把两个东西组合起来，看看会长出什么离谱结果。";
        if (/象棋|棋|chess|gomoku|五子/.test(text)) return "用一局清晰可玩的规则挑战，证明你的策略还在线。";
        return `挑战「${title || "这个小游戏"}」，拿到一个值得截图分享的结果。`;
      }

      function inferTags(title, extraText) {
        const text = `${title || ""} ${extraText || ""}`.toLowerCase();
        if (/圆|circle/.test(text)) return ["手感挑战", "百分制", "结果卡"];
        if (/密码|password/.test(text)) return ["规则递进", "吐槽感", "可重玩"];
        if (/真假|logo|fake|判断/.test(text)) return ["真假判断", "正确率", "称号"];
        if (/颜色|color/.test(text)) return ["记忆挑战", "色差评分", "截图友好"];
        if (/组合|craft|合成|词/.test(text)) return ["无限组合", "发现数", "离谱结果"];
        return ["一句话挑战", "结果可晒", "可重玩"];
      }

      function normalizeTags(value) {
        const list = Array.isArray(value) ? value : String(value || "").split(/[,\s，、]+/);
        const clean = [];
        for (const item of list) {
          const text = normalizeInlineText(item, 12);
          if (text && !clean.includes(text)) clean.push(text);
          if (clean.length >= 4) break;
        }
        return clean.length ? clean : ["一句话挑战", "结果可晒", "可重玩"];
      }

      function normalizeInlineText(value, maxLength) {
        return String(value || "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, maxLength);
      }

      async function savePreviewResult(data) {
        const metric = normalizeInlineText(data.metric || data.result || data.score || "已完成挑战", 100);
        const shareText = normalizeInlineText(data.shareText || getShareText(currentPreview), 280);
        const updated = {
          ...currentPreview,
          lastResult: {
            metric,
            shareText,
            at: new Date().toISOString()
          },
          updatedAt: new Date().toISOString()
        };
        currentPreview = updated;
        await putGame(updated);
        await refreshGames();
        showPreviewNotice(`已记录结果：${metric}`, "ok");
      }

      function getShareText(game) {
        if (!game) return "";
        if (game.lastResult?.shareText) return game.lastResult.shareText;
        return game.defaultShareText || `我刚玩了「${game.title}」：${game.hook || inferHook(game.title, game.gameName)}。来试试你的结果。`;
      }

      async function copyCurrentShareText() {
        if (!currentPreview) return;
        await copyShareText(getShareText(currentPreview), currentPreview);
      }

      async function copyShareText(text, game) {
        const mode = await copyText(text);
        const suffix = game?.lastResult?.metric ? `（${game.lastResult.metric}）` : "";
        showMessage(mode === "prompt" ? `已打开复制兜底：${game?.title || "分享文案"}${suffix}` : `分享文案已复制：${game?.title || "当前游戏"}${suffix}`, "ok");
      }

      async function copyText(text) {
        if (!text) return "empty";
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return "clipboard";
          } catch (error) {}
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          if (document.execCommand("copy")) return "fallback";
        } catch (error) {
        } finally {
          textarea.remove();
        }

        window.prompt("复制下面的分享文案", text);
        return "prompt";

      function openPreview(game) {

      async function captureCurrentPreviewThumbnail() {
        if (!currentPreview || hasRealThumbnail(currentPreview)) return;

          const doc = els.gamePreview.contentDocument;

          const image = captureCanvasThumbnail(doc) || await captureDomThumbnail(doc) || await captureThumbnailForGame(currentPreview);
          if (!image || image.length < 2000) return;

            ...currentPreview,

            updatedAt: new Date().toISOString()

      function hasRealThumbnail(game) {
        return Boolean(getRealThumbnail(game));
      }

      function scheduleMissingThumbnails(list) {
        for (const game of list) {
          if (!game?.id || !game.html || hasRealThumbnail(game)) continue;
          const key = `${game.id}:${game.version || 1}:${game.updatedAt || ""}`;
          if (thumbnailCaptureAttempted.has(key)) continue;
          thumbnailCaptureAttempted.add(key);
          thumbnailCaptureQueue.push({ id: game.id, key });
        }
        if (!thumbnailCaptureRunning && thumbnailCaptureQueue.length) {
          window.setTimeout(processThumbnailQueue, 250);
        }
      }

      async function processThumbnailQueue() {
        if (thumbnailCaptureRunning) return;
        thumbnailCaptureRunning = true;
        try {
          const workers = Array.from(
            { length: Math.min(THUMBNAIL_CAPTURE_CONCURRENCY, thumbnailCaptureQueue.length) },
            () => processThumbnailWorker()
          );
          await Promise.all(workers);
        } finally {
          thumbnailCaptureRunning = false;
          if (thumbnailCaptureQueue.length) {
            window.setTimeout(processThumbnailQueue, 0);
          }
        }
      }

      async function processThumbnailWorker() {
        while (thumbnailCaptureQueue.length) {
          const queued = thumbnailCaptureQueue.shift();
          const game = games.find((item) => item.id === queued.id);
          if (!game || !game.html || hasRealThumbnail(game)) continue;
          const image = await captureThumbnailForGame(game);
          if (!image || image.length < 2000) {
            thumbnailCaptureAttempted.delete(queued.key);
            continue;
          }
          const latest = games.find((item) => item.id === queued.id);
          if (!latest || latest.version !== game.version || latest.updatedAt !== game.updatedAt) continue;
          const updated = { ...latest, thumbnail: image };
          const index = games.findIndex((item) => item.id === updated.id);
          if (index >= 0) games[index] = updated;
          if (currentPreview?.id === updated.id) currentPreview = { ...currentPreview, thumbnail: image };
          await putGame(updated);
          updateCardThumbnail(updated);
        }
      }

      function updateCardThumbnail(game) {
        const row = Array.from(els.gameList.querySelectorAll(".game-row"))
          .find((item) => item.dataset.gameId === String(game.id));
        if (!row) return;
        const thumb = row.querySelector(".game-thumb");
        if (!thumb) return;
        let img = thumb.querySelector("img");
        if (!img) {
          img = document.createElement("img");
          const title = thumb.querySelector("h3");
          thumb.insertBefore(img, title || null);
        }
        thumb.classList.remove("is-missing-thumb");
        thumb.querySelector(".thumb-fallback")?.remove();
        img.alt = `${game.title} 预览图`;
        img.loading = "lazy";
        img.src = getRealThumbnail(game);
      }

      async function captureThumbnailForGame(game) {
        try {
          const data = await requestJson("/api/thumbnail", {
            method: "POST",
            body: { title: game.title, html: game.html }
          });
          if (getRealThumbnail(data.thumbnail) && data.thumbnail.length > 2000) {
            return data.thumbnail;
          }
        } catch (error) {
        }
        return captureThumbnailInBrowser(game);
      }

      function captureThumbnailInBrowser(game) {
        return new Promise((resolve) => {
          let settled = false;
          let url = "";
          const frame = document.createElement("iframe");

          const cleanup = (image) => {
            if (settled) return;
            settled = true;
            frame.onload = null;
            frame.remove();
            if (url) URL.revokeObjectURL(url);
            resolve(image || "");
          };

          frame.title = "游戏截图生成";
          frame.tabIndex = -1;
          frame.scrolling = "no";
          frame.setAttribute("aria-hidden", "true");
          Object.assign(frame.style, {
            position: "fixed",
            width: "960px",
            height: "540px",
            left: "-12000px",
            top: "0",
            border: "0",
            pointerEvents: "none",
            opacity: "0.01"
          });

          frame.onload = () => {
            window.setTimeout(async () => {
              try {
                const doc = frame.contentDocument;
                const image = doc ? (captureCanvasThumbnail(doc) || await captureDomThumbnail(doc)) : "";
                cleanup(image);
              } catch (error) {
                cleanup("");
              }
            }, 1100);
          };

          try {
            url = URL.createObjectURL(new Blob([game.html], { type: "text/html;charset=utf-8" }));
            document.body.appendChild(frame);
            frame.src = url;
            window.setTimeout(() => cleanup(""), 5200);
          } catch (error) {
            cleanup("");
          }
        });
      }

      function captureCanvasThumbnail(doc) {
        try {
          const canvas = doc.querySelector("canvas");
          if (!canvas || !canvas.width || !canvas.height) return "";
          const thumb = document.createElement("canvas");
          thumb.width = 480;
          thumb.height = 270;
          const ctx = thumb.getContext("2d");
          ctx.fillStyle = "#fff8e8";
          ctx.fillRect(0, 0, thumb.width, thumb.height);
          const scale = Math.min(thumb.width / canvas.width, thumb.height / canvas.height);
          const width = canvas.width * scale;
          const height = canvas.height * scale;
          ctx.drawImage(canvas, (thumb.width - width) / 2, (thumb.height - height) / 2, width, height);
          return thumb.toDataURL("image/jpeg", 0.72);
        } catch (error) {
          return "";
        }
      }

      function captureDomThumbnail(doc) {
        return new Promise((resolve) => {
          try {
            const win = doc.defaultView || window;
            const width = Math.max(320, Math.min(960, Math.round(win.innerWidth || doc.documentElement.clientWidth || 480)));
            const height = Math.max(180, Math.min(540, Math.round(win.innerHeight || doc.documentElement.clientHeight || 270)));
            const clone = (doc.body || doc.documentElement).cloneNode(true);
            clone.querySelectorAll("script").forEach((script) => script.remove());
            clone.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
            const previousStyle = clone.getAttribute("style") || "";
            clone.setAttribute("style", `${previousStyle}; margin:0; width:${width}px; height:${height}px; overflow:hidden;`);
            const styles = Array.from(doc.querySelectorAll("style")).map((style) => style.textContent || "").join("\n");
            const body = new XMLSerializer().serializeToString(clone);
            const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <foreignObject width="100%" height="100%">
    <style xmlns="http://www.w3.org/1999/xhtml">${styles.replace(/</g, "&lt;")}</style>
    ${body}
  </foreignObject>
</svg>`.trim();
            const image = new Image();
            image.onload = () => {
              try {
                const thumb = document.createElement("canvas");
                thumb.width = 480;
                thumb.height = 270;
                const ctx = thumb.getContext("2d");
                ctx.fillStyle = "#fff8e8";
                ctx.fillRect(0, 0, thumb.width, thumb.height);
                ctx.drawImage(image, 0, 0, thumb.width, thumb.height);
                resolve(thumb.toDataURL("image/jpeg", 0.72));
              } catch (error) {
                resolve("");
              }
            };
            image.onerror = () => resolve("");
            image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
          } catch (error) {
            resolve("");
          }
        });
      }

      async function repairPreview() {

                "要求：启动后必须立刻显示可见且可操作的游戏画面；主游戏卡片、画布、棋盘、滑块、开始按钮或答题控件必须在首屏内；空的结果/记录/状态区要隐藏或压缩，不能占据大块高度；如果脚本报错请修复；如果没有报错但 body/canvas 为空，请补齐 DOM、Canvas 尺寸和首帧绘制；不要使用外部资源、import、fetch、localStorage、sessionStorage 或 module script；保留完整单文件 HTML。",
                "如果游戏在玩家没有有效点击、按键、触摸或开始操作前就 Game Over、失败或 0 分结算，必须改为 ready/start 状态；首次有效输入后至少 1.5 秒宽限；初始球、敌人、障碍、失败线和碰撞阈值必须公平，不能重叠或一开局就在失败区。",

        const injection = previewFitStyle + script;
        if (/<head[^>]*>/i.test(html)) {
          return html.replace(/<head([^>]*)>/i, `<head$1>${injection}`);
        }
        if (/<html[^>]*>/i.test(html)) {
          return html.replace(/<html([^>]*)>/i, `<html$1><head>${injection}</head>`);
        }
        return injection + html;

      function showPreviewNotice(text, type) {
        els.previewNotice.textContent = text;
        els.previewNotice.classList.add("visible");
        els.previewNotice.classList.toggle("ok", type === "ok");
      }

      function clearPreviewNotice() {
        els.previewNotice.textContent = "";
        els.previewNotice.classList.remove("visible");
        els.previewNotice.classList.remove("ok");
      }

      function openEdit(game) {
        currentEdit = game;
        els.editTitle.textContent = `AI 修改：${game.title}`;
        els.editInstruction.value = "";
        els.editModal.classList.remove("hidden");
        setTimeout(() => els.editInstruction.focus(), 0);
      }

      function closeEdit() {
        els.editModal.classList.add("hidden");
        els.editInstruction.value = "";
        currentEdit = null;
      }

      async function renameGame(game) {
        const title = prompt("新的游戏名称", game.title);
        if (title == null) return;
        const nextTitle = title.trim();
        if (!nextTitle) return;
        const updated = { ...game, title: nextTitle.slice(0, 120), updatedAt: new Date().toISOString() };
        await putGame(updated);
        await refreshGames();
        showMessage("已重命名。", "ok");
      }

      async function deleteGame(game) {
        if (!confirm(`删除“${game.title}”？`)) return;
        await removeGame(game.id);
        if (currentPreview?.id === game.id) closePreview();
        await refreshGames();
        showMessage("已删除。", "ok");
      }

      function downloadGame(game) {
        const blob = new Blob([game.html], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "index.html";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function requestJson(url, options = {}) {
        let response;
        try {
          response = await fetch(url, {
            method: options.method || "GET",
            headers: options.body ? { "Content-Type": "application/json" } : undefined,
            body: options.body ? JSON.stringify(options.body) : undefined
          });
        } catch (error) {
          throw new Error("后端连接中断或请求超时，请确认 node server.js 仍在运行，然后重试。");
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = data.detail ? `：${data.detail}` : "";
          throw new Error((data.error || "请求失败") + detail);
        }
        return data;
      }

      function openDb() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE)) {
              const store = db.createObjectStore(STORE, { keyPath: "id" });
              store.createIndex("updatedAt", "updatedAt");
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        return dbPromise;
      }

      async function getAllGames() {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readonly");
          const request = tx.objectStore(STORE).getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
      }

      async function putGame(game) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).put(game);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      async function removeGame(id) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }

      function setBusy(isBusy, text, estimateMs) {
        stopProgressTimer();
        els.busyText.textContent = text || "正在处理";
        els.busyLayer.classList.toggle("hidden", !isBusy);
        els.generateBtn.disabled = isBusy;
        els.submitEditBtn.disabled = isBusy;
        if (isBusy) {
          startProgressTimer(estimateMs || 180000);
        } else {
          els.progressFill.style.width = "100%";
          els.progressPercent.textContent = "100%";
          els.progressEta.textContent = "已完成";
        }
      }

      function startProgressTimer(estimateMs) {
        progressStartedAt = Date.now();
        progressEstimateMs = Math.max(estimateMs, 3000);
        updateProgress();
        progressTimer = window.setInterval(updateProgress, 1000);
      }

      function stopProgressTimer() {
        if (progressTimer) {
          window.clearInterval(progressTimer);
          progressTimer = null;
        }
      }

      function updateProgress() {
        const elapsed = Date.now() - progressStartedAt;
        const ratio = elapsed / progressEstimateMs;
        const eased = 1 - Math.pow(1 - Math.min(ratio, 1), 2.4);
        const percent = ratio <= 1 ? Math.min(92, Math.max(3, Math.round(eased * 92))) : 92;
        const remaining = Math.max(0, progressEstimateMs - elapsed);

        els.progressFill.style.width = `${percent}%`;
        els.progressPercent.textContent = `${percent}%`;
        els.progressEta.textContent = remaining > 0
          ? `预计剩余 ${formatDuration(remaining)}`
          : `已超出预计 ${formatDuration(elapsed - progressEstimateMs)}，继续等待`;
      }

      function showMessage(text, type) {
        els.message.textContent = text;
        els.message.classList.toggle("error", type === "error");
        els.message.classList.toggle("ok", type === "ok");
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `game-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function formatDate(value) {
        const date = value ? new Date(value) : new Date();
        if (Number.isNaN(date.getTime())) return "未知时间";
        return date.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function formatBytes(chars) {
        const bytes = new Blob(["x".repeat(chars)]).size;
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
      }

      function formatDuration(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        const minutes = Math.floor(total / 60);
        const seconds = total % 60;
        if (minutes <= 0) return `${seconds}s`;
        return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
